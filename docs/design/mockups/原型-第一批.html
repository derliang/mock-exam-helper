<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>模擬考原型</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700&display=swap">
<style>
/* 模擬考小幫手 design tokens（M1 定案）。沿用座位小幫手 v3.4.0，只加班級六色與標示色。只用十六進位色碼（匯出函式庫不吃 oklch）。 */
:root{
  --bg:#F5F2EA; --surface:#FFFDF8; --sunken:#F1EDE3;
  --line:#E4DECF; --line-2:#CFC7B2;
  --text:#22201B; --text-2:#4F493D; --text-3:#6F6858;
  --accent:#274690; --accent-on:#FFFFFF; --accent-soft:#E8EDF8; --accent-ink:#1F3877; --accent-line:#B9C6E6;
  --danger:#C81E45; --danger-soft:#FDECEF; --danger-ink:#9B1237; --danger-line:#F3B4C1;
  --warn-soft:#FBF0D5; --warn-ink:#6B4300; --warn-line:#E3C07A; --warn-bar:#C98A12;
  --ok-soft:#E3F2E0; --ok-ink:#1F5A1A; --ok-line:#A5D39D; --ok-bar:#3C8B34;
  --att-fill:#22201B; --att-on:#FFFDF8;
  --cut:#8E8670;
  --c1-bg:#FBE7C6; --c1-line:#E0B365; --c1-ink:#6B4300;
  --c2-bg:#D8EFD3; --c2-line:#8CC784; --c2-ink:#1F5A1A;
  --c3-bg:#D6E6F8; --c3-line:#8DB4E2; --c3-ink:#1A4478;
  --c4-bg:#E7DCF5; --c4-line:#B39DD9; --c4-ink:#4A2E80;
  --c5-bg:#F6D6EC; --c5-line:#D98ABF; --c5-ink:#7A1C5E;
  --c6-bg:#F9D5CA; --c6-line:#E58A70; --c6-ink:#7A2A12;
  --shadow-1:0 1px 2px rgba(34,32,27,.08),0 1px 1px rgba(34,32,27,.04);
  --shadow-2:0 4px 14px rgba(34,32,27,.10);
  --shadow-3:0 16px 40px rgba(34,32,27,.22);
  --r-sm:8px; --r-md:12px; --r-lg:16px; --r-xl:24px;
  --f-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-head:"Noto Serif TC","Noto Sans TC","PMingLiU",serif;
  --f-no:"Noto Sans TC","Microsoft JhengHei",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#13120E; --surface:#1C1A15; --sunken:#17150F;
  --line:#302D24; --line-2:#433F33;
  --text:#F1EDE2; --text-2:#CFC8B6; --text-3:#A0987F;
  --accent:#3F63C4; --accent-on:#FFFFFF; --accent-soft:#1B2540; --accent-ink:#AFC2F5; --accent-line:#33467E;
  --danger:#F0617F; --danger-soft:#3A1A22; --danger-ink:#F7B2C0; --danger-line:#6B2B3B;
  --warn-soft:#3A2E12; --warn-ink:#F3D690; --warn-line:#6F5620; --warn-bar:#E0A832;
  --ok-soft:#1C3220; --ok-ink:#B9E3B2; --ok-line:#3B6B3C; --ok-bar:#5DB257;
  --att-fill:#F1EDE2; --att-on:#13120E;
  --cut:#7C755F;
  --c1-bg:#3B2F14; --c1-line:#7A6125; --c1-ink:#F5DDA3;
  --c2-bg:#1E3320; --c2-line:#3E6B41; --c2-ink:#BFE5BC;
  --c3-bg:#1C2D45; --c3-line:#3D5F8E; --c3-ink:#BCD4F2;
  --c4-bg:#2D2342; --c4-line:#5B4A8A; --c4-ink:#D8C9F2;
  --c5-bg:#43203A; --c5-line:#8A3F78; --c5-ink:#F5C3E6;
  --c6-bg:#432519; --c6-line:#8A4A33; --c6-ink:#F7CFC0;
  --shadow-1:0 1px 2px rgba(0,0,0,.5); --shadow-2:0 4px 14px rgba(0,0,0,.5); --shadow-3:0 16px 40px rgba(0,0,0,.7);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13120E; --surface:#1C1A15; --sunken:#17150F;
  --line:#302D24; --line-2:#433F33;
  --text:#F1EDE2; --text-2:#CFC8B6; --text-3:#A0987F;
  --accent:#3F63C4; --accent-on:#FFFFFF; --accent-soft:#1B2540; --accent-ink:#AFC2F5; --accent-line:#33467E;
  --danger:#F0617F; --danger-soft:#3A1A22; --danger-ink:#F7B2C0; --danger-line:#6B2B3B;
  --warn-soft:#3A2E12; --warn-ink:#F3D690; --warn-line:#6F5620; --warn-bar:#E0A832;
  --ok-soft:#1C3220; --ok-ink:#B9E3B2; --ok-line:#3B6B3C; --ok-bar:#5DB257;
  --att-fill:#F1EDE2; --att-on:#13120E;
  --cut:#7C755F;
  --c1-bg:#3B2F14; --c1-line:#7A6125; --c1-ink:#F5DDA3;
  --c2-bg:#1E3320; --c2-line:#3E6B41; --c2-ink:#BFE5BC;
  --c3-bg:#1C2D45; --c3-line:#3D5F8E; --c3-ink:#BCD4F2;
  --c4-bg:#2D2342; --c4-line:#5B4A8A; --c4-ink:#D8C9F2;
  --c5-bg:#43203A; --c5-line:#8A3F78; --c5-ink:#F5C3E6;
  --c6-bg:#432519; --c6-line:#8A4A33; --c6-ink:#F7CFC0;
  --shadow-1:0 1px 2px rgba(0,0,0,.5); --shadow-2:0 4px 14px rgba(0,0,0,.5); --shadow-3:0 16px 40px rgba(0,0,0,.7);
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--f-ui);font-size:14px;line-height:1.65;
  padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
.wrap{max-width:1120px;margin:0 auto;padding-block:20px 80px}
h1,h2,h3{font-family:var(--f-head);font-weight:700;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:26px} h2{font-size:21px} h3{font-size:16px}
p{margin:0}
.muted{color:var(--text-3)} .small{font-size:12px}
.num{font-variant-numeric:tabular-nums}
code{font-family:ui-monospace,Consolas,monospace;font-size:12px;background:var(--sunken);border:1px solid var(--line);border-radius:6px;padding:1px 5px}

/* 頁首 */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-left,0px));display:flex;gap:12px;align-items:center;flex-wrap:wrap}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.top .brand{font-family:var(--f-head);font-weight:700;font-size:16px;margin-right:auto}
.toc{display:flex;gap:4px;flex-wrap:wrap}
.toc a{color:var(--text-2);text-decoration:none;padding:6px 10px;border-radius:var(--r-sm);font-weight:500}
.toc a:hover{background:var(--sunken);color:var(--text)}
.hero{padding-block:28px 8px;display:grid;gap:10px}
.hero p{max-width:68ch;color:var(--text-2)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:8px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px}
.fact b{display:block;font-size:12px;color:var(--text-3);font-weight:700;margin-bottom:2px}
section{padding-top:48px;scroll-margin-top:64px}
section>header{display:grid;gap:6px;margin-bottom:18px}
section>header p{color:var(--text-2);max-width:72ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;box-shadow:var(--shadow-1);min-width:0}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.stack{display:grid;gap:16px;min-width:0}
.grid2{display:grid;gap:16px;grid-template-columns:260px minmax(0,1fr)}
@media (max-width:700px){.grid2{grid-template-columns:minmax(0,1fr)}.prev{overflow-x:auto;justify-items:start}}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.lab{font-size:12px;font-weight:700;color:var(--text-3);margin-bottom:8px;letter-spacing:.04em}
.pending{display:inline-block;font-size:12px;font-weight:700;padding:1px 8px;border-radius:99px;background:var(--warn-soft);color:var(--warn-ink);border:1px solid var(--warn-line);vertical-align:middle;margin-left:6px}
.scroll{overflow-x:auto;max-width:100%}

/* 色票 */
.sw-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.swatch{border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;background:var(--surface)}
.swatch i{display:block;height:44px;border-bottom:1px solid var(--line)}
.swatch div{padding:6px 10px;font-size:12px;line-height:1.4}
.swatch b{display:block;font-size:12px}
.swatch span{color:var(--text-3);font-family:ui-monospace,Consolas,monospace}

/* 字型 */
.fonts{display:grid;gap:12px}
.fontrow{display:grid;grid-template-columns:170px 1fr;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.fontrow:last-child{border-bottom:0}
.fontrow .nm{font-size:12px;color:var(--text-3);font-weight:700}
@media (max-width:640px){.fontrow{grid-template-columns:1fr}}
.no-sample{display:flex;gap:18px;flex-wrap:wrap}
.no-sample div{background:var(--sunken);border:1px solid var(--line);border-radius:var(--r-md);padding:10px 16px;text-align:center;min-width:128px}
.no-sample strong{display:block;font-size:34px;line-height:1.1;font-variant-numeric:tabular-nums}
.no-sample small{display:block;font-size:12px;color:var(--text-3);margin-top:4px}
table.t{border-collapse:collapse;width:100%;min-width:560px}
.t th{text-align:left;font-size:12px;color:var(--text-3);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line-2);background:var(--sunken);white-space:nowrap}
.t td{padding:8px 10px;border-bottom:1px solid var(--line)}
.t tbody tr:hover{background:var(--accent-soft)}
.t td.n{font-variant-numeric:tabular-nums}
.t tr.gap td{color:var(--text-3);font-style:normal;background:repeating-linear-gradient(135deg,transparent 0 6px,var(--sunken) 6px 12px)}
.dem{display:grid;gap:8px}
.dem div{display:grid;grid-template-columns:90px 1fr;gap:12px;align-items:baseline}
.space-demo{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap}
.space-demo i{display:block;background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:3px}
.rad{display:flex;gap:14px;flex-wrap:wrap}
.rad div{width:92px;height:62px;background:var(--surface);border:1px solid var(--line-2);display:grid;place-items:center;font-size:12px;color:var(--text-2)}

/* 按鈕 */
.btn{font:inherit;font-weight:700;min-height:40px;padding:0 16px;border-radius:var(--r-sm);border:1px solid var(--line-2);background:var(--surface);color:var(--text);cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:background .15s,border-color .15s}
.btn:hover{background:var(--sunken);border-color:var(--text-3)}
.btn:focus-visible,.input:focus-visible,.seg button:focus-visible,.cell:focus-visible,.step:focus-visible,.icon-btn:focus-visible,.sw input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px}
.btn-primary{background:var(--accent);color:var(--accent-on);border-color:var(--accent)}
.btn-primary:hover{background:var(--accent);filter:brightness(1.12);border-color:var(--accent)}
.btn-danger{background:var(--danger-soft);color:var(--danger-ink);border-color:var(--danger-line)}
.btn-danger:hover{background:var(--danger-soft);border-color:var(--danger)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--accent-ink)}
.btn-ghost:hover{background:var(--accent-soft);border-color:transparent}
.btn-sm{min-height:32px;padding:0 10px;font-size:12px}
.btn-lg{min-height:48px;padding:0 22px;font-size:15px}
.btn[disabled]{opacity:1;background:var(--sunken);color:var(--text-3);border-color:var(--line);cursor:not-allowed}
.icon-btn{width:40px;height:40px;border-radius:var(--r-sm);border:1px solid var(--line-2);background:var(--surface);color:var(--text);font:inherit;font-weight:700;font-size:18px;cursor:pointer}
.icon-btn:hover{background:var(--sunken)}

/* 表單 */
.field{display:grid;gap:6px;min-width:0}
.field label,.label{font-size:12px;font-weight:700;color:var(--text-2)}
.input{font:inherit;min-height:40px;padding:0 12px;border-radius:var(--r-sm);border:1px solid var(--line-2);background:var(--sunken);color:var(--text);width:100%}
.input:focus{border-color:var(--accent)}
.hint{font-size:12px;color:var(--text-3)}
.err .input{border-color:var(--danger)} .err .hint{color:var(--danger-ink)}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:var(--r-sm);overflow:hidden;background:var(--sunken)}
.seg button{font:inherit;font-weight:700;min-height:36px;padding:0 14px;border:0;background:transparent;color:var(--text-2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-on)}
.seg button:disabled{color:var(--text-3);cursor:not-allowed;background:repeating-linear-gradient(135deg,transparent 0 5px,var(--line) 5px 10px)}
.sw{display:inline-flex;gap:10px;align-items:center;cursor:pointer;font-weight:500}
.sw input{position:absolute;opacity:0;width:1px;height:1px}
.sw span{width:42px;height:24px;border-radius:99px;background:var(--line-2);position:relative;transition:background .15s;flex:none}
.sw span::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:var(--surface);transition:transform .15s;box-shadow:var(--shadow-1)}
.sw input:checked+span{background:var(--accent)}
.sw input:checked+span::after{transform:translateX(18px)}
.check{display:inline-flex;gap:8px;align-items:center;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.stepper{display:inline-flex;align-items:center;gap:6px}
.stepper output{min-width:44px;text-align:center;font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}

/* 徽章、提示 */
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;border:1px solid var(--line-2);background:var(--sunken);color:var(--text-2)}
.b-acc{background:var(--accent-soft);color:var(--accent-ink);border-color:var(--accent-line)}
.b-ok{background:var(--ok-soft);color:var(--ok-ink);border-color:var(--ok-line)}
.b-warn{background:var(--warn-soft);color:var(--warn-ink);border-color:var(--warn-line)}
.b-err{background:var(--danger-soft);color:var(--danger-ink);border-color:var(--danger-line)}
.b-soon{background:repeating-linear-gradient(135deg,transparent 0 5px,var(--line) 5px 10px);color:var(--text-2)}
.alert{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;padding:12px 14px;border-radius:var(--r-md);border:1px solid;font-weight:500}
.alert b{font-weight:700}
.a-info{background:var(--accent-soft);color:var(--accent-ink);border-color:var(--accent-line)}
.a-warn{background:var(--warn-soft);color:var(--warn-ink);border-color:var(--warn-line)}
.a-err{background:var(--danger-soft);color:var(--danger-ink);border-color:var(--danger-line)}
.a-ok{background:var(--ok-soft);color:var(--ok-ink);border-color:var(--ok-line)}
.ico{font-weight:700;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:13px;background:currentColor;flex:none}
.ico::before{content:attr(data-i);color:var(--surface)}
.toast{display:inline-flex;gap:10px;align-items:center;background:var(--att-fill);color:var(--att-on);padding:10px 16px;border-radius:var(--r-md);box-shadow:var(--shadow-3);font-weight:700}
.modal-frame{background:rgba(20,18,12,.45);border-radius:var(--r-lg);padding:28px 16px;display:grid;place-items:center}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-xl);box-shadow:var(--shadow-3);width:min(100%,460px);padding:22px;display:grid;gap:14px}
.modal .acts{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.empty{border:1.5px dashed var(--line-2);border-radius:var(--r-lg);padding:28px 18px;text-align:center;display:grid;gap:8px;justify-items:center;background:var(--sunken)}

/* 步驟導覽 */
.shell{display:grid;grid-template-columns:220px minmax(0,1fr) 200px;gap:12px;min-height:150px}
@media (max-width:760px){.shell{grid-template-columns:1fr}}
.shell>div{border:1.5px dashed var(--line-2);border-radius:var(--r-md);padding:10px;background:var(--sunken);font-size:12px;color:var(--text-3);font-weight:700}
.steps{display:grid;gap:4px;list-style:none;margin:0;padding:0}
.step{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:8px 10px;border-radius:var(--r-md);border:1px solid transparent;background:transparent;color:var(--text);font:inherit;text-align:left;cursor:pointer;width:100%;min-height:44px}
.step:hover{background:var(--sunken)}
.step .no{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;border:1.5px solid var(--line-2);background:var(--surface);color:var(--text-2)}
.step small{display:block;color:var(--text-3);font-size:12px;line-height:1.3}
.step.cur{background:var(--accent-soft);border-color:var(--accent-line)}
.step.cur .no{background:var(--accent);border-color:var(--accent);color:var(--accent-on)}
.step.done .no{background:var(--ok-soft);border-color:var(--ok-bar);color:var(--ok-ink)}
.step.stale .no{background:var(--warn-soft);border-color:var(--warn-bar);color:var(--warn-ink)}

/* 統計列 */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
.stats>div{background:var(--surface);padding:10px 14px}
.stats small{display:block;font-size:13px;font-weight:700;color:var(--text-3)}
.stats strong{font-family:var(--f-no);font-size:32px;line-height:1.2;font-weight:700;font-variant-numeric:tabular-nums}
#statTable td.n{font-size:18px;font-weight:700}
.stats .bad strong{color:var(--danger-ink)}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent)}

/* 步進器預覽 */
.prev{display:grid;gap:8px;justify-items:center;background:var(--sunken);border:1px solid var(--line);border-radius:var(--r-md);padding:14px}
.pgrid{display:grid;gap:4px}
.pc{width:40px;height:30px;border-radius:6px;border:1px solid var(--line-2);background:var(--surface);cursor:pointer;padding:0;font:inherit;font-size:11px;color:var(--text-3);font-variant-numeric:tabular-nums}
.pc:hover{border-color:var(--accent)}
.pc.off{background:repeating-linear-gradient(135deg,var(--sunken) 0 4px,var(--line-2) 4px 8px);border-style:dashed;color:transparent}
.podium{width:60%;text-align:center;font-size:12px;font-weight:700;color:var(--text-2);border:1px solid var(--line-2);border-radius:6px;padding:2px 0;background:var(--surface)}

/* 座位格與標籤格（專案專屬） */
.chart{--cw:96px;--ch:80px}
.sheet{--cw:108px;--ch:116px}
.chart.gray,.sheet.gray{filter:grayscale(1) contrast(1.05)}
.cell{position:relative;width:var(--cw);height:var(--ch);display:grid;grid-template-rows:1fr auto auto;align-items:center;justify-items:center;padding:4px 2px 3px;row-gap:1px;border:1px solid var(--cut);margin:0;background:var(--surface);color:var(--text);font-family:var(--f-no);text-align:center;line-height:1.1;overflow:hidden}
.cell[data-c="1"]{background:var(--c1-bg)} .cell[data-c="2"]{background:var(--c2-bg)} .cell[data-c="3"]{background:var(--c3-bg)}
.cell[data-c="4"]{background:var(--c4-bg)} .cell[data-c="5"]{background:var(--c5-bg)} .cell[data-c="6"]{background:var(--c6-bg)}
.cell[data-c="1"] .meta{color:var(--c1-ink)} .cell[data-c="2"] .meta{color:var(--c2-ink)} .cell[data-c="3"] .meta{color:var(--c3-ink)}
.cell[data-c="4"] .meta{color:var(--c4-ink)} .cell[data-c="5"] .meta{color:var(--c5-ink)} .cell[data-c="6"] .meta{color:var(--c6-ink)}
.cell .no{font-size:22px;font-weight:700;letter-spacing:.02em;font-variant-numeric:tabular-nums;color:var(--text)}

      '<div class="card stack"><div class="lab">3　預設設定</div>'+
        (prev?'<div class="alert a-info"><span class="ico" data-i="i"></span><span><b>會帶入「'+prev.name+'」的設定</b>：學生名單、教室、'+(isJ?'':'標示與抽離規則、')+'名稱以外的選項。每一步都能再改，改了不影響舊的模擬考。</span><span></span></div>':'<div class="alert a-warn"><span class="ico" data-i="!"></span><span>還沒有同類型的模擬考，所有步驟從空白開始。</span><span></span></div>')+
        (isJ?'<div class="alert a-info"><span class="ico" data-i="i"></span><span>會考不需要標示與抽離，步驟④會顯示「不需要」。<span class="pending">待使用者確認</span></span><span></span></div>':'')+
      '</div>'+
      '<div class="row" style="justify-content:flex-end"><button class="btn" data-act="list">取消</button><button class="btn btn-primary btn-lg" data-act="create">建立並開始</button></div></div>'}
  function stepState(i){var e=S.cur,j=i-1;var s=(e&&e.prog&&e.prog[j])||'';if(S.cur.type==='會考'&&i===4)return 'skip';if(i===S.step)return 'cur';return s==='d'?'done':s==='s'?'stale':''}
  function vWs(){
    var e=S.cur,sl=STEPS.map(function(s,i){var st=stepState(i+1),tag=st==='done'?'<span class="badge b-ok">已完成</span>':st==='stale'?'<span class="badge b-warn">過期</span>':st==='cur'?'<span class="badge b-acc">目前</span>':st==='skip'?'<span class="badge b-soon">不需要</span>':'<span class="badge">未完成</span>';
      return '<li><button class="step '+(st==='skip'?'skip':st)+'" type="button" data-act="step" data-n="'+(i+1)+'"'+(i+1===S.step?' aria-current="step"':'')+'><span class="no">'+(st==='done'?'✓':st==='stale'?'!':(i+1))+'</span><span><b>'+s[0]+'</b><small>'+s[1]+'</small></span></button></li>'}).join('');
    var s=STEPS[S.step-1];
    return '<div class="pagehead"><button class="btn btn-ghost" data-act="list">← 模擬考列表</button><h1 style="font-size:22px">'+e.name+'</h1><span class="badge">'+typeLabel(e.type)+'</span><span class="small muted">已儲存到資料夾（模擬）</span></div>'+
      '<div class="ws"><aside class="side"><div class="card" style="padding:10px"><ol class="steps">'+sl+'</ol></div></aside>'+
      '<section class="main"><div class="card"><h2 style="font-size:19px">'+'①②③④⑤⑥'.charAt(S.step-1)+' '+s[0]+'</h2><p class="muted small">'+s[1]+'</p></div>'+
      '<div class="ph"><strong>這一步的畫面在下一批做</strong><span>第一批先審核：初始化、考試列表、新增考試。工作區骨架（左側步驟、可自由跳）可以先點點看。</span></div></section>'+
      '<aside class="side side-r"><div class="card stack"><div class="lab">詳細面板</div><p class="small muted">之後放這一步的說明、統計與驗證結果。</p></div></aside></div>'}

  function render(){
    var v=S.screen==='init'?vInit():S.screen==='list'?vList():S.screen==='new'?vNew():vWs();
    $('#app').innerHTML=v;nav();window.scrollTo(0,0)}
  function go(s){S.screen=s;render()}

  /* ---------- 模擬資料夾選擇 ---------- */
  function openPick(){
    $('#modalHost').innerHTML='<div class="mfade" id="mf"><div class="modal" role="dialog" aria-label="選擇資料夾（模擬）" style="width:min(100%,520px)"><h3>選擇資料夾（模擬）</h3><p class="small muted">真正使用時，這個視窗是瀏覽器自己的，這裡只示範流程。</p>'+
      '<div class="fakepick"><div class="bar">本機 › D:</div><button type="button" data-pk="D:\\模擬考資料" aria-pressed="true">📁 模擬考資料</button><button type="button" data-pk="D:\\文件">📁 文件</button><button type="button" data-pk="D:\\下載">📁 下載</button></div>'+
      '<div class="alert a-info"><span class="ico" data-i="i"></span><span>瀏覽器會問：「讓這個網站檢視並編輯這個資料夾的檔案？」請選「允許」。</span><span></span></div>'+
      '<div class="acts"><button class="btn" data-mclose>取消</button><button class="btn btn-primary" id="pkok">選取並允許</button></div></div></div>';
    var sel='D:\\模擬考資料';
    $('#modalHost').onclick=function(e){var p=e.target.closest('[data-pk]');
      if(p){sel=p.getAttribute('data-pk');document.querySelectorAll('[data-pk]').forEach(function(x){x.setAttribute('aria-pressed',String(x===p))})}
      if(e.target.closest('[data-mclose]')||e.target.id==='mf')$('#modalHost').innerHTML='';
      if(e.target.id==='pkok'){S.folder=sel;$('#modalHost').innerHTML='';toast('已授權資料夾：'+sel+'（模擬）');go('list')}}}

  /* ---------- 事件 ---------- */
  $('#app').addEventListener('click',function(e){var b=e.target.closest('[data-act]');if(!b)return;var a=b.getAttribute('data-act');
    if(a==='pick')openPick();
    else if(a==='list')go('list');
    else if(a==='new'){S.type='學測';S.name='';S.year='115';go('new')}
    else if(a==='type'){S.type=b.getAttribute('data-t');S.name='';render()}
    else if(a==='open'){S.cur=S.exams.filter(function(x){return x.id==b.getAttribute('data-id')})[0];S.step=1;go('ws')}
    else if(a==='step'){S.step=+b.getAttribute('data-n');render()}
    else if(a==='create'){var nm=($('#nn')||{}).value||S.name;var isJ=S.type==='會考';var ex={id:Date.now(),name:nm,type:S.type,level:isJ?'國三':'高三',year:S.year,n:isJ?236:266,prog:['c','','','','',''],note:'剛建立',edit:'2026-11-07 15:30'};if(isJ)ex.prog[3]='n';S.exams.unshift(ex);S.cur=ex;S.step=1;S.name='';toast('已建立「'+nm+'」，並帶入上一次的設定');go('ws')}});
  $('#app').addEventListener('input',function(e){if(e.target.id==='nn')S.name=e.target.value});
  $('#app').addEventListener('change',function(e){if(e.target.id==='ny')S.year=e.target.value});
  render();
})();
</script>

</body>
</html>
