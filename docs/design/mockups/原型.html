<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>模擬考原型 稿 v2.30</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700&display=swap">
<style>
/* 模擬考小幫手 design tokens（M1 定案）。沿用座位小幫手 v3.4.0，只加班級六色與標示色。只用十六進位色碼（匯出函式庫不吃 oklch）。 */
:root{
  --bg:#F5F2EA; --surface:#FFFDF8; --sunken:#F1EDE3;
  --line:#E4DECF; --line-2:#CFC7B2;
  --text:#22201B; --text-2:#4F493D; --text-3:#6F6858;
  --accent:#274690; --accent-on:#FFFFFF; --accent-soft:#E8EDF8; --accent-ink:#1F3877; --accent-line:#B9C6E6;
  --danger:#C81E45; --danger-soft:#FDECEF; --danger-ink:#9B1237; --danger-line:#F3B4C1;
  --warn-soft:#FBF0D5; --warn-ink:#6B4300; --warn-line:#E3C07A; --warn-bar:#C98A12;
  --ok-soft:#E3F2E0; --ok-ink:#1F5A1A; --ok-line:#A5D39D; --ok-bar:#3C8B34;
  --fmt-word:#2A6AC8; --fmt-pdf:#B8423A; --fmt-xls:#1F7A47;
  --fmt-word-soft:#E6EEFB; --fmt-pdf-soft:#FBEAE8; --fmt-xls-soft:#E3F2E8;
  --att-fill:#22201B; --att-on:#FFFDF8;
  --cut:#8E8670;
  --c1-bg:#E7DCF5; --c1-line:#B39DD9; --c1-ink:#4A2E80;
  --c2-bg:#F6D6EC; --c2-line:#D98ABF; --c2-ink:#7A1C5E;
  --c3-bg:#CDEDE9; --c3-line:#6FC0B6; --c3-ink:#0F5A52;
  --c4-bg:#EBDCCB; --c4-line:#C09A72; --c4-ink:#5C3A17;
  --c5-bg:#DFE3E8; --c5-line:#9AA5B1; --c5-ink:#2F3B48;
  --c6-bg:#EBD9E3; --c6-line:#C79BB5; --c6-ink:#5E2D49;
  --c7-bg:#CDB6EA; --c7-line:#8F6FC4; --c7-ink:#35205F;
  --c8-bg:#EFB6DC; --c8-line:#C4569F; --c8-ink:#5F0F46;
  --c9-bg:#A9DDD6; --c9-line:#3E9E92; --c9-ink:#093F39;
  --c10-bg:#D9BE9F; --c10-line:#A4743F; --c10-ink:#432810;
  --c11-bg:#BCC5CF; --c11-line:#6C7B8B; --c11-ink:#1E2833;
  --c12-bg:#D9B6CB; --c12-line:#A5668A; --c12-ink:#46172F;
  --shadow-1:0 1px 2px rgba(34,32,27,.07),0 2px 6px -2px rgba(34,32,27,.06);
  --shadow-2:0 2px 4px rgba(34,32,27,.06),0 10px 24px -8px rgba(34,32,27,.16);
  --shadow-3:0 4px 8px rgba(34,32,27,.08),0 24px 48px -12px rgba(34,32,27,.30);
  --shadow-accent:0 1px 2px rgba(39,70,144,.35),0 5px 12px -5px rgba(39,70,144,.50);
  --shadow-inset:inset 0 1px 2px rgba(34,32,27,.08);
  --shadow-bar:0 8px 14px -12px rgba(34,32,27,.40);
  --ease:cubic-bezier(.2,.7,.2,1); --dur:.16s;
  --r-sm:8px; --r-md:12px; --r-lg:16px; --r-xl:24px;
  --f-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-head:"Noto Serif TC","Noto Sans TC","PMingLiU",serif;
  --f-no:"Noto Sans TC","Microsoft JhengHei",sans-serif;
}

  --bg:#13120E; --surface:#1C1A15; --sunken:#17150F;

  --accent:#3F63C4; --accent-on:#FFFFFF; --accent-soft:#1B2540; --accent-ink:#AFC2F5; --accent-line:#33467E;
  --danger:#F0617F; --danger-soft:#3A1A22; --danger-ink:#F7B2C0; --danger-line:#6B2B3B;
  --warn-soft:#3A2E12; --warn-ink:#F3D690; --warn-line:#6F5620; --warn-bar:#E0A832;

  --att-fill:#F1EDE2; --att-on:#13120E;
  --cut:#7C755F;
  --c1-bg:#2E2347; --c1-line:#6B568F; --c1-ink:#E0D2F5;
  --c2-bg:#43203A; --c2-line:#8C4478; --c2-ink:#F5C3E4;
  --c3-bg:#12332F; --c3-line:#3F8078; --c3-ink:#BEEAE4;
  --c4-bg:#3A2D1F; --c4-line:#7C5E3C; --c4-ink:#EBD6BC;
  --c5-bg:#26292E; --c5-line:#566170; --c5-ink:#D3D9E0;
  --c6-bg:#3A2230; --c6-line:#8A5A75; --c6-ink:#EBD0DE;
  --c7-bg:#3C2E5C; --c7-line:#8468B8; --c7-ink:#E8DBFA;
  --c8-bg:#52294A; --c8-line:#A8558F; --c8-ink:#FAD0EB;
  --c9-bg:#1A423D; --c9-line:#4F9B91; --c9-ink:#C9F0EA;
  --c10-bg:#4A3826; --c10-line:#92704A; --c10-ink:#F0DEC8;
  --c11-bg:#343A42; --c11-line:#6C7886; --c11-ink:#E2E7EC;
  --c12-bg:#4A2D3E; --c12-line:#9C6B88; --c12-ink:#F2DCE8;
  --shadow-1:0 1px 2px rgba(0,0,0,.55),0 2px 8px -2px rgba(0,0,0,.40),inset 0 1px 0 rgba(255,255,255,.03); --shadow-2:0 2px 4px rgba(0,0,0,.5),0 10px 24px -8px rgba(0,0,0,.6); --shadow-3:0 4px 8px rgba(0,0,0,.5),0 24px 48px -12px rgba(0,0,0,.75);
  --shadow-accent:0 1px 2px rgba(0,0,0,.5),0 5px 12px -5px rgba(63,99,196,.55); --shadow-inset:inset 0 1px 2px rgba(0,0,0,.35); --shadow-bar:0 8px 14px -12px rgba(0,0,0,.8);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13120E; --surface:#1C1A15; --sunken:#17150F;
  --line:#302D24; --line-2:#433F33;
  --text:#F1EDE2; --text-2:#CFC8B6; --text-3:#A0987F;
  --accent:#3F63C4; --accent-on:#FFFFFF; --accent-soft:#1B2540; --accent-ink:#AFC2F5; --accent-line:#33467E;
  --danger:#F0617F; --danger-soft:#3A1A22; --danger-ink:#F7B2C0; --danger-line:#6B2B3B;
  --warn-soft:#3A2E12; --warn-ink:#F3D690; --warn-line:#6F5620; --warn-bar:#E0A832;
  --ok-soft:#1C3220; --ok-ink:#B9E3B2; --ok-line:#3B6B3C; --ok-bar:#5DB257;
  --fmt-word:#5B93E6; --fmt-pdf:#E0766E; --fmt-xls:#4DB57A;
  --fmt-word-soft:#1B2740; --fmt-pdf-soft:#3A1F1D; --fmt-xls-soft:#1A3326;
  --att-fill:#F1EDE2; --att-on:#13120E;
  --cut:#7C755F;
  --c1-bg:#2E2347; --c1-line:#6B568F; --c1-ink:#E0D2F5;
  --c2-bg:#43203A; --c2-line:#8C4478; --c2-ink:#F5C3E4;
  --c3-bg:#12332F; --c3-line:#3F8078; --c3-ink:#BEEAE4;
  --c4-bg:#3A2D1F; --c4-line:#7C5E3C; --c4-ink:#EBD6BC;
  --c5-bg:#26292E; --c5-line:#566170; --c5-ink:#D3D9E0;
  --c6-bg:#3A2230; --c6-line:#8A5A75; --c6-ink:#EBD0DE;
  --c7-bg:#3C2E5C; --c7-line:#8468B8; --c7-ink:#E8DBFA;
  --c8-bg:#52294A; --c8-line:#A8558F; --c8-ink:#FAD0EB;
  --c9-bg:#1A423D; --c9-line:#4F9B91; --c9-ink:#C9F0EA;
  --c10-bg:#4A3826; --c10-line:#92704A; --c10-ink:#F0DEC8;
  --c11-bg:#343A42; --c11-line:#6C7886; --c11-ink:#E2E7EC;
  --c12-bg:#4A2D3E; --c12-line:#9C6B88; --c12-ink:#F2DCE8;
  --shadow-1:0 1px 2px rgba(0,0,0,.55),0 2px 8px -2px rgba(0,0,0,.40),inset 0 1px 0 rgba(255,255,255,.03); --shadow-2:0 2px 4px rgba(0,0,0,.5),0 10px 24px -8px rgba(0,0,0,.6); --shadow-3:0 4px 8px rgba(0,0,0,.5),0 24px 48px -12px rgba(0,0,0,.75);
  --shadow-accent:0 1px 2px rgba(0,0,0,.5),0 5px 12px -5px rgba(63,99,196,.55); --shadow-inset:inset 0 1px 2px rgba(0,0,0,.35); --shadow-bar:0 8px 14px -12px rgba(0,0,0,.8);
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--f-ui);font-size:14px;line-height:1.65;
  padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
.wrap{max-width:1160px;margin:20px auto 64px;padding:24px;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-xl);box-shadow:var(--shadow-2)}
@media (max-width:560px){.wrap{padding:14px;margin-top:12px;border-radius:var(--r-lg)}}
h1,h2,h3{font-family:var(--f-head);font-weight:700;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:26px} h2{font-size:26px} h3{font-size:18px}
p{margin:0}
.muted{color:var(--text-3)} .small{font-size:13px}
.num{font-variant-numeric:tabular-nums}
code{font-family:ui-monospace,Consolas,monospace;font-size:12px;background:var(--sunken);border:1px solid var(--line);border-radius:6px;padding:1px 5px}

/* 頁首 */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-left,0px));display:flex;gap:12px;align-items:center;flex-wrap:wrap}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.top .brand{font-family:var(--f-head);font-weight:700;font-size:14px;margin-right:auto}
.toc{display:flex;gap:4px;flex-wrap:wrap}
.toc a{color:var(--text-2);text-decoration:none;padding:6px 10px;border-radius:var(--r-sm);font-weight:500}
.toc a:hover{background:var(--sunken);color:var(--text)}
.hero{padding-block:28px 8px;display:grid;gap:10px}
.hero p{max-width:68ch;color:var(--text-2)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:8px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px}
.fact b{display:block;font-size:13px;color:var(--text-3);font-weight:700;margin-bottom:2px}
section{padding-top:48px;scroll-margin-top:64px}
section>header{display:grid;gap:6px;margin-bottom:18px}
section>header p{color:var(--text-2);max-width:72ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;box-shadow:var(--shadow-1);min-width:0}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.stack{display:grid;gap:16px;min-width:0}
.grid2{display:grid;gap:16px;grid-template-columns:260px minmax(0,1fr)}
@media (max-width:700px){.grid2{grid-template-columns:minmax(0,1fr)}.prev{overflow-x:auto;justify-items:start}}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.lab{font-size:13px;font-weight:700;color:var(--text-3);margin-bottom:8px;letter-spacing:.04em}
.pending{display:inline-block;font-size:13px;font-weight:700;padding:1px 8px;border-radius:99px;background:var(--warn-soft);color:var(--warn-ink);border:1px solid var(--warn-line);vertical-align:middle;margin-left:6px}
.scroll{overflow-x:auto;max-width:100%}

/* 色票 */
.sw-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.swatch{border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;background:var(--surface)}
.swatch i{display:block;height:44px;border-bottom:1px solid var(--line)}
.swatch div{padding:6px 10px;font-size:13px;line-height:1.4}
.swatch b{display:block;font-size:13px}
.swatch span{color:var(--text-3);font-family:ui-monospace,Consolas,monospace}

/* 字型 */
.fonts{display:grid;gap:12px}
.fontrow{display:grid;grid-template-columns:170px 1fr;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.fontrow:last-child{border-bottom:0}
.fontrow .nm{font-size:13px;color:var(--text-3);font-weight:700}
@media (max-width:640px){.fontrow{grid-template-columns:1fr}}
.no-sample{display:flex;gap:18px;flex-wrap:wrap}
.no-sample div{background:var(--sunken);border:1px solid var(--line);border-radius:var(--r-md);padding:10px 16px;text-align:center;min-width:128px}
.no-sample strong{display:block;font-size:34px;line-height:1.1;font-variant-numeric:tabular-nums}
.no-sample small{display:block;font-size:13px;color:var(--text-3);margin-top:4px}
table.t{border-collapse:collapse;width:100%;min-width:560px}
.t th{text-align:left;font-size:13px;color:var(--text-3);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line-2);background:var(--sunken);white-space:nowrap}
.t td{padding:8px 10px;border-bottom:1px solid var(--line)}
.t tbody tr:hover{background:var(--accent-soft)}
.t td.n{font-variant-numeric:tabular-nums}
.t tr.gap td{color:var(--text-3);font-style:normal;background:repeating-linear-gradient(135deg,transparent 0 6px,var(--sunken) 6px 12px)}
.dem{display:grid;gap:8px}
.dem div{display:grid;grid-template-columns:90px 1fr;gap:12px;align-items:baseline}
.space-demo{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap}
.space-demo i{display:block;background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:3px}
.rad{display:flex;gap:14px;flex-wrap:wrap}
.rad div{width:92px;height:62px;background:var(--surface);border:1px solid var(--line-2);display:grid;place-items:center;font-size:13px;color:var(--text-2)}

/* 按鈕 */
.btn{font:inherit;font-weight:700;min-height:40px;padding:0 16px;border-radius:var(--r-sm);border:1px solid var(--line-2);background:var(--surface);color:var(--text);cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:background .15s,border-color .15s}
.btn:hover{background:var(--sunken);border-color:var(--text-3)}
.btn:focus-visible,.input:focus-visible,.seg button:focus-visible,.cell:focus-visible,.step:focus-visible,.icon-btn:focus-visible,.sw input:focus-visible+.trk,.fmt input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px}
.btn-primary{background:var(--accent);color:var(--accent-on);border-color:var(--accent)}
.btn-primary:hover{background:var(--accent);filter:brightness(1.12);border-color:var(--accent)}
.btn-danger{background:var(--danger-soft);color:var(--danger-ink);border-color:var(--danger-line)}
.btn-danger:hover{background:var(--danger-soft);border-color:var(--danger)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--accent-ink)}
.btn-ghost:hover{background:var(--accent-soft);border-color:transparent}
.btn-sm{min-height:32px;padding:0 10px;font-size:13px}
.btn-lg{min-height:40px;padding:0 20px;font-size:14px}
.btn{justify-content:center;white-space:nowrap}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btnrow .btn{min-width:96px}
.btn[disabled]{opacity:1;background:var(--sunken);color:var(--text-3);border-color:var(--line);cursor:not-allowed}
.icon-btn{width:40px;height:40px;border-radius:var(--r-sm);border:1px solid var(--line-2);background:var(--surface);color:var(--text);font:inherit;font-weight:700;font-size:18px;cursor:pointer}
.icon-btn:hover{background:var(--sunken)}

/* 表單 */
.field{display:grid;gap:6px;min-width:0}
.field label,.label{font-size:13px;font-weight:700;color:var(--text-2)}
.input{font:inherit;height:40px;min-height:40px;padding:0 12px;border-radius:var(--r-sm);border:1px solid var(--line-2);background:var(--sunken);color:var(--text);width:100%}
.input:focus{border-color:var(--accent)}
.hint{font-size:13px;color:var(--text-3)}
.err .input{border-color:var(--danger)} .err .hint{color:var(--danger-ink)}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:var(--r-sm);overflow:hidden;background:var(--sunken)}
.seg button{font:inherit;font-weight:700;min-height:36px;padding:0 14px;border:0;background:transparent;color:var(--text-2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-on)}
.seg button:disabled{color:var(--text-3);cursor:not-allowed;background:repeating-linear-gradient(135deg,transparent 0 5px,var(--line) 5px 10px)}
.sw{display:inline-flex;align-items:center;gap:10px;cursor:pointer}
.sw input{position:absolute;opacity:0;width:1px;height:1px}
.trk{width:46px;height:26px;border-radius:99px;background:var(--line-2);position:relative;transition:background .15s;flex:none}
.trk::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow-1);transition:transform .15s}
.sw input:checked+.trk{background:var(--accent)}
.sw input:checked+.trk::after{transform:translateX(20px)}
.sw .st{font-size:13px;font-weight:700;color:var(--text-3);white-space:nowrap}
.sw input:checked~.st{color:var(--accent-ink)}
.sw .no{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;border:1.5px solid var(--line-2);background:var(--surface);color:var(--text-2);flex:none}
.fmts{display:flex;gap:10px;flex-wrap:wrap}
.fmt{cursor:pointer}
.fmt input{position:absolute;opacity:0;width:1px;height:1px}
.fmt span{display:inline-flex;align-items:center;gap:10px;min-height:48px;padding:0 18px 0 12px;border-radius:var(--r-md);border:1.5px solid var(--line-2);background:var(--surface);font-weight:700;color:var(--text)}
.fmt:hover span{background:var(--sunken)}
.fmt svg{width:26px;height:26px;flex:none}
.fmt.w input:checked+span{background:var(--fmt-word-soft);border-color:var(--fmt-word)}
.fmt.p input:checked+span{background:var(--fmt-pdf-soft);border-color:var(--fmt-pdf)}
.fmt.x input:checked+span{background:var(--fmt-xls-soft);border-color:var(--fmt-xls)}
.ic-bg-w{fill:var(--fmt-word)} .ic-bg-p{fill:var(--fmt-pdf)} .ic-bg-x{fill:var(--fmt-xls)}
.check{display:inline-flex;gap:8px;align-items:center;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.stepper{display:inline-flex;align-items:center;gap:6px}
.stepper output{min-width:44px;text-align:center;font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}

/* 徽章、提示 */
.badge{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:700;padding:2px 9px;border-radius:99px;border:1px solid var(--line-2);background:var(--sunken);color:var(--text-2)}
.b-acc{background:var(--accent-soft);color:var(--accent-ink);border-color:var(--accent-line)}
.b-ok{background:var(--ok-soft);color:var(--ok-ink);border-color:var(--ok-line)}
.b-warn{background:var(--warn-soft);color:var(--warn-ink);border-color:var(--warn-line)}
.b-err{background:var(--danger-soft);color:var(--danger-ink);border-color:var(--danger-line)}
.b-soon{background:repeating-linear-gradient(135deg,transparent 0 5px,var(--line) 5px 10px);color:var(--text-2)}
.alert{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;padding:12px 14px;border-radius:var(--r-md);border:1px solid;font-weight:500}
.alert b{font-weight:700}
.a-info{background:var(--accent-soft);color:var(--accent-ink);border-color:var(--accent-line)}
.a-warn{background:var(--warn-soft);color:var(--warn-ink);border-color:var(--warn-line)}
.a-err{background:var(--danger-soft);color:var(--danger-ink);border-color:var(--danger-line)}
.a-ok{background:var(--ok-soft);color:var(--ok-ink);border-color:var(--ok-line)}

/* ===== 步驟⑥ 預覽：真實匯出的紙面樣式（同 設計系統.html 座位表與標籤、src/export/htmlRender.ts；紙面永遠淺色，單位 mm）===== */

  position:absolute;left:0;top:0;transform-origin:0 0;background:#fff;color:var(--ink);box-shadow:0 2px 12px rgba(0,0,0,.18);

.pp .pp-grid{display:grid;border-top:.35mm solid var(--cut);border-left:.35mm solid var(--cut);width:max-content}

.pp .pp-c{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.4mm;border-right:.35mm solid var(--cut);border-bottom:.35mm solid var(--cut);text-align:center}

.pp .pp-mk{display:block;font-weight:700;line-height:1.25;padding:0 1.4mm;border-radius:.6mm;white-space:nowrap}

/* 格內分三區（編號區／姓名／標示區固定高），有沒有標示位置都一樣，三區之間有留白，不擠在中間 */

.pp.pp-lab .pp-no{align-self:end;margin-bottom:2.6mm;font-size:31pt}.pp.pp-lab .pp-nm{font-size:15pt}.pp.pp-lab .pp-mk{font-size:12pt}.pp.pp-lab .pp-co{font-size:9pt}

<script>
(function(){
  /* ---------- 主題 ---------- */
  var root=document.documentElement, tb={sys:document.getElementById('thSys'),light:document.getElementById('thLight'),dark:document.getElementById('thDark')};
  function setTheme(m){if(m==='sys')root.removeAttribute('data-theme');else root.setAttribute('data-theme',m);for(var k in tb)tb[k].setAttribute('aria-pressed',String(k===m))}

      ks.map(function(k){var x=per.exam[k];return '<tr><td><span class="badge b-acc">考試</span></td><td><b>'+esc(aName(k))+'</b></td><td class="n">'+x.list.length+'</td><td>'+astFromText(x.from)+'</td></tr>'}).join('')+
      per.sorder.map(function(k){var x=per.study[k];return '<tr><td><span class="badge">'+(x.kind==='borrow'?'借用自習':'自習')+'</span></td><td><b>'+esc(aName(k))+'</b></td><td class="n">'+x.list.length+'</td><td>'+astFromText(x.from)+'</td></tr>'}).join('')+
      per.pend.map(function(u){return '<tr><td><span class="badge b-warn">待核可</span></td><td>—</td><td class="n">'+u.n+'</td><td>'+CNAME[u.c]+' '+u.n+'</td></tr>'}).join('')+'</tbody></table></div>';
    /* 座位圖 */
    var room=aRoom(sel.k),chart='',roomSeg='';
    roomSeg='<div class="seg" role="group" aria-label="這個時段的考場">'+ks.map(function(k){return '<button type="button" data-act="ast_pick" data-p="'+sel.p+'" data-k="'+k+'" aria-pressed="'+(k===sel.k)+'">'+esc(aShort(k))+'</button>'}).join('')+'</div>';
    var present={};
    if(room&&per.exam[sel.k]){var map=astLayout(room,per.exam[sel.k].list);Object.keys(map).forEach(function(kk){present[map[kk].c]=1});
      chart=astChart(room,map,'【115學年第一次分科模擬考】座位表',PL(per.p)+' '+per.subj+'　'+room.name+'　考生 '+per.exam[sel.k].list.length+' 人',A.hl)}
    var view='<div class="seg" role="group" aria-label="檢視班級"><button type="button" data-act="ast_hl" data-c="-1" aria-pressed="'+(A.hl<0)+'">全部班級</button>'+Object.keys(present).map(Number).sort().map(function(c){return '<button type="button" data-act="ast_hl" data-c="'+c+'" aria-pressed="'+(A.hl===c)+'">只看'+CNAME[c]+'</button>'}).join('')+'</div>';
    var rules='<div class="small muted"><b>教室內怎麼排（第二階段，順序固定、不權衡）：</b>①同班依座號由小到大，同一排只放同一班、各班各自連續；②不同科盡量分排，同排混科只准「連續分區」、不准逐位交錯；③跨科盡量同座位，但輸給①（發卷核對與座號依序優先）。座號依序、同排同班不會為了少用教室而放棄。</div>';
    /* 示範：文理同節 */
    var mixCard='';
    var K=aRoom('k0'),mm={},ml=[];for(var i=1;i<=14;i++)ml.push({c:2,no:i,s:'化學'});for(var j=1;j<=14;j++)ml.push({c:5,no:j,s:'地理'});
    var cols=0,qi=0;for(var col=1;col<=K.depths.length&&qi<ml.length;col++)for(var row=1;row<=K.depths[col-1]&&qi<ml.length;row++){mm[col+','+row]=ml[qi++]}
    var mixHtml='';
    if(A.mix){var cells='';var C=K.depths.length,R=Math.max.apply(null,K.depths);
      mixHtml='<div class="chart"><div class="chart-wrap"><div class="chart-title">示範：綜合教室一（文理同節）<small>化學 14 人（連續分區，第 1～3 排前段）＋地理 14 人（連續分區，其後）</small></div><div class="axis-y" style="grid-template-rows:repeat('+R+',var(--ch))">';
      for(var q2=R;q2>=1;q2--)mixHtml+='<span>'+q2+'</span>';
      mixHtml+='</div><div><div class="cg" style="grid-template-columns:repeat('+C+',var(--cw))">';
      for(var rw=R;rw>=1;rw--)for(var cl=1;cl<=C;cl++){var s=mm[cl+','+rw];mixHtml+=s?'<div class="cell" data-c="'+cc(s.c)+'"><span class="co">'+cl+'-'+rw+'</span><span class="no">'+aid(s)+'</span><span class="meta"><span class="tg">'+CNAME[s.c]+'</span>'+esc(fakeName(s.c,s.no))+'</span><span class="mks"><span class="mk" style="background:var(--surface);color:var(--text);border:2px solid var(--text)">'+s.s+'</span></span></div>':'<div class="cell empty-seat"></div>'}
      mixHtml+='</div><div class="axis-x" style="grid-template-columns:repeat('+C+',var(--cw));margin-top:4px">';for(var c3=1;c3<=C;c3++)mixHtml+='<span>第'+c3+'排</span>';
      mixHtml+='</div></div><div class="podium-bar">講　台</div></div></div>'}
    mixCard='<div class="card stack"><div class="row" style="justify-content:space-between"><div><h3>示範：文理同節時的混科考場</h3><p class="small muted">標準兩天 8 個時段不會混科。學校把兩天壓成一天、文理同節考不同科時，少教室優先可能把兩科的少數人合併進同一間綜合教室：<b>同排混科只准連續分區</b>，每個座位格另標科目，發卷時一科一區。完整的時程調整另稿。</p></div><button type="button" class="btn" data-act="ast_mix" aria-pressed="'+A.mix+'">'+(A.mix?'收合示範':'看示範')+'</button></div>'+(A.mix?'<div class="chartbox">'+mixHtml+'</div>':'')+'</div>';
    /* 硬性限制驗證 */
    var bad={cap:0,dup:0,both:0,seat:0},seen={};
    sim.per.forEach(function(x){x.sorder.forEach(function(k){if(x.exam[k])bad.both++;if(x.study[k].list.length>aStudy(aRoom(k)))bad.cap++});x.order.forEach(function(k){if(x.exam[k].list.length>aSeats(aRoom(k)))bad.seat++})});
    Object.keys(sim.loc).forEach(function(id){sim.loc[id].forEach(function(x,p){if(!x)bad.dup++})});
    var pendN=g.met.pend;
    function vr(ok,t,d){return '<div class="row" style="justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:6px"><span>'+(ok?'<span class="badge b-ok">通過</span>':'<span class="badge b-err">不通過</span>')+'　'+t+'</span><span class="small muted">'+d+'</span></div>'}
    var chks=vr(bad.both===0,'同一時段同一間教室只能是考場或自習其中一種',bad.both?bad.both+' 處':'0 處')+vr(bad.seat===0,'考場人數不超過可排座位',bad.seat?bad.seat+' 處':'0 處')+vr(bad.cap===0,'自習人數不超過自習容量',bad.cap?bad.cap+' 處':'0 處')+vr(bad.dup===0,'每位考生每個時段都有明確位置（考場、自習或原班）',bad.dup?bad.dup+' 處':'0 處')+vr(pendN===0,'沒有尚待核可的替代方案',pendN?pendN+' 人待核可':'0 人');
    var modeBar='<div class="row" style="justify-content:space-between"><div class="small muted">目前模式：<b>'+(A.mode==='few'?'少教室優先':'少移動優先')+'</b>・用 '+g.met.rooms+' 間教室・離開原班 '+(g.met.leaveX+g.met.leaveS)+' 人次</div><div class="row"><button class="btn btn-sm" data-act="step" data-n="4">到 ④ 換模式</button></div></div>';
    return '<div class="card stack"><div><h3>各時段教室用途</h3><p class="small muted">每一格是一間教室在那個時段的用途。點一格看那個時段的考場與座位圖；點上面的時段看整個時段。</p></div>'+modeBar+'<div class="scroll"><table class="ut"><thead>'+head1+head2+'</thead><tbody>'+body+'</tbody></table></div>'+legend+props+okapv+'</div>'+
      '<div class="card stack"><div class="row" style="justify-content:space-between"><div><h3>'+PL(per.p)+'（'+per.subj+'）</h3><p class="small muted">這個時段誰在哪間教室。</p></div></div>'+sum+ext+'</div>'+
      '<div class="card stack"><div class="row" style="justify-content:space-between;flex-wrap:wrap"><div><h3>考場座位圖</h3><p class="small muted">每排深位數可以不同；斜線格＝停用或沒有這個座位。</p></div>'+roomSeg+'</div>'+view+'<div class="chartbox">'+chart+'</div>'+rules+'</div>'+mixCard+
      '<div class="card stack"><div><h3>硬性限制檢查</h3><p class="small muted">不符合就不輸出看似成功的結果。</p></div>'+chks+'</div>'}
  function astV6Note(){
    return '<div class="card stack"><div class="alert a-warn"><span class="ico" data-i="!"></span><span><b>分科的標籤與班級公告是下一批稿。</b>分科改成「每個時段各自排」之後，標籤沿用合併標籤（每座位一張、各時段一行、印節次＋科目，有應試編號才印），並新增「依原班逐生、各時段各一欄」的班級公告；下面是舊版畫面，之後會被取代，請先別審這一頁的分科內容。</span><span></span></div></div>'}
  function astAct(a,b){
    var A=astInit(),g=function(k){return b.getAttribute('data-'+k)},r;
    if(a==='ast_mode'){A.mode=g('m')}
    else if(a==='ast_pick'){A.sel.p=+g('p');if(g('k'))A.sel.k=g('k');else A.sel.k=null}
    else if(a==='ast_apv'){A.apv[A.mode+'|'+g('p')]=true;toast('已核可：'+PL(+g('p'))+'自習借用原班教室（示範）')}
    else if(a==='ast_unapv'){delete A.apv[A.mode+'|'+g('p')]}
    else if(a==='ast_hl'){A.hl=+g('c')}
    else if(a==='ast_mix'){A.mix=!A.mix}
    else if(a==='ast_allow'){A.allow=!A.allow}
    else if(a==='ast_comp'){r=aRoom(g('k'));r.on=!r.on}
    else if(a==='ast_edit'){A.exp=(A.exp===g('k'))?null:g('k')}
    else if(a==='ast_scap'){r=aRoom(g('k'));var cur=aStudy(r);r.scap=Math.max(0,cur+(+g('d')));if(r.scap===aSeats(r))r.scap=null}
    else if(a==='ast_scapreset'){aRoom(g('k')).scap=null}
    else if(a==='ast_depth'){r=aRoom(g('k'));var i=+g('i');r.depths[i]=Math.max(1,Math.min(8,r.depths[i]+(+g('d'))))}
    else if(a==='ast_seat'){r=aRoom(g('k'));var sk=g('s');if(r.off[sk])delete r.off[sk];else r.off[sk]=1}
    else if(a==='ast_addk'){var n=A.rooms.filter(function(x){return x.kind==='k'}).length+1;A.rooms.push({key:'k'+(n-1),name:'綜合教室'+'一二三四五六七八'.charAt(n-1),kind:'k',depths:[5,5,5,5],off:{},scap:null,on:true});toast('已新增（示範）：座位圖與自習容量可再調整')}
    else if(a==='ast_togo3'){S.step=3}
    if(a!=='ast_pick'&&a!=='ast_hl'&&a!=='ast_mix'&&a!=='ast_edit')markStale();
    render()}
  var NEXT0=NEXT;NEXT=function(e,n){if(e.type==='分科'){if(n===3)return [4,'④ 排座模式與方案'];if(n===4)return [5,'⑤ 時段教室與座位']}return NEXT0(e,n)};
  /* ---------- 事件 ---------- */
  $('#app').addEventListener('click',function(e){var b=e.target.closest('[data-act]');if(!b)return;var a=b.getAttribute('data-act');
    if(a==='pick')openPick();
    else if(a==='list')go('list');
    else if(a==='new'){S.type='學測';S.name='';S.term='上學期';go('new')}
    else if(a==='term'){if(b.getAttribute('data-w')==='new')S.term=b.getAttribute('data-t');else{pushUndo('學期');S.cur.term=b.getAttribute('data-t')}render()}
    else if(a==='type'){S.type=b.getAttribute('data-t');S.name='';if(S.type==='學測')S.term='上學期';else if(S.type==='分科')S.term='下學期';render()}
    else if(a==='open'){S.cur=S.exams.filter(function(x){return x.id==b.getAttribute('data-id')})[0];S.step=1;go('ws')}
    else if(a==='step'){S.step=+b.getAttribute('data-n');S.ret=null;render()}
    else if(a==='round'){pushUndo('次別');var ce=S.cur;ce.round=+b.getAttribute('data-r');if(/^學測第.次$/.test(ce.name))ce.name='學測第'+CN[ce.round]+'次';ce.subj=null;render()}
    else if(a==='carry'){S.cur.carry=S.cur.carry===false?true:false;render()}
    else if(a==='next1'){S.cur.prog[0]='d';S.step=2;toast('已儲存「'+S.cur.name+'」的考試設定（模擬）');render()}
    else if(a==='create'){var nm=($('#nn')||{}).value||S.name;var isJ=S.type==='會考';var rn=S.exams.filter(function(x){return x.type===S.type}).length+1;var ex={id:Date.now(),round:rn,round0:rn,cmpPending:true,name:nm,type:S.type,level:isJ?'國三':'高三',year:String(schoolYear()),term:S.term,n:isJ?236:266,prog:['c','','','','',''],note:'剛建立',edit:'2026-11-07 15:30'};if(isJ)ex.prog[3]='n';if(S.type==='分科')ex.part='part';S.exams.unshift(ex);S.cur=ex;S.step=1;S.name='';toast('已建立「'+nm+'」，並帶入上一次的設定');go('ws')}});
  document.addEventListener('click',function(e){if(S.undoOpen&&!e.target.closest('.undowrap')){S.undoOpen=false;render()}});
  $('#app').addEventListener('input',function(e){if(e.target.id==='nn')S.name=e.target.value;if(e.target.id==='xn')S.cur.name=e.target.value});
  $('#app').addEventListener('change',function(e){if(e.target.id==='ny')S.term=e.target.value;if(e.target.id==='xy'){S.cur.term=e.target.value;render()}if(e.target.getAttribute&&e.target.getAttribute('data-ei')!==null&&S.cmp){var ed=S.cmp.edit[+e.target.getAttribute('data-ei')],f=e.target.getAttribute('data-ef'),v=e.target.value;ed[f]=f==='name'?v:+v;render()}});
  document.querySelector('.appfoot').addEventListener('click',function(e){var t=e.target.closest('[data-ft]');if(!t)return;e.preventDefault();var k=t.getAttribute('data-ft'),h;
    if(k==='copy')h='<h3>版權</h3><p>© 2026 derliang｜保留所有權利｜限非營利使用</p><p class="small muted">原型說明：實作是站內獨立的版權頁（不連到 GitHub），頁頂有「← 返回」；這裡用視窗示意。</p>';
    else if(k==='priv')h='<h3>隱私權</h3><p>學生名單與座位結果只存在你的電腦，本網站不會主動上傳；若資料夾與雲端硬碟同步，同步軟體可能另行上傳。</p><p class="small muted">原型說明：實作是站內獨立的隱私權頁，頁頂有「← 返回」；這裡用視窗示意。</p>';
    else h='<h3>關於</h3><p>模擬考小幫手　v1.0.0</p><p class="small muted">版本號與頁首品牌區是同一來源（package.json），建置時注入；建置日期用台北時間。</p>';
    showModal('<div class="modal" role="dialog" aria-label="'+(k==='copy'?'版權':k==='priv'?'隱私權':'關於')+'" style="width:min(100%,460px)">'+h+'<div class="acts"><button class="btn" data-mclose>← 返回</button></div></div>',function(){})});
  render();
})();
</script>
