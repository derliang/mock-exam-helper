<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>模擬考原型 稿 v2.7</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700&display=swap">
<style>
/* 模擬考小幫手 design tokens（M1 定案）。沿用座位小幫手 v3.4.0，只加班級六色與標示色。只用十六進位色碼（匯出函式庫不吃 oklch）。 */
:root{
  --bg:#F5F2EA; --surface:#FFFDF8; --sunken:#F1EDE3;
  --line:#E4DECF; --line-2:#CFC7B2;
  --text:#22201B; --text-2:#4F493D; --text-3:#6F6858;
  --accent:#274690; --accent-on:#FFFFFF; --accent-soft:#E8EDF8; --accent-ink:#1F3877; --accent-line:#B9C6E6;
  --danger:#C81E45; --danger-soft:#FDECEF; --danger-ink:#9B1237; --danger-line:#F3B4C1;
  --warn-soft:#FBF0D5; --warn-ink:#6B4300; --warn-line:#E3C07A; --warn-bar:#C98A12;
  --ok-soft:#E3F2E0; --ok-ink:#1F5A1A; --ok-line:#A5D39D; --ok-bar:#3C8B34;
  --fmt-word:#2A6AC8; --fmt-pdf:#B8423A; --fmt-xls:#1F7A47;
  --fmt-word-soft:#E6EEFB; --fmt-pdf-soft:#FBEAE8; --fmt-xls-soft:#E3F2E8;
  --att-fill:#22201B; --att-on:#FFFDF8;
  --cut:#8E8670;
  --c1-bg:#FBE7C6; --c1-line:#E0B365; --c1-ink:#6B4300;
  --c2-bg:#D8EFD3; --c2-line:#8CC784; --c2-ink:#1F5A1A;
  --c3-bg:#D6E6F8; --c3-line:#8DB4E2; --c3-ink:#1A4478;
  --c4-bg:#E7DCF5; --c4-line:#B39DD9; --c4-ink:#4A2E80;
  --c5-bg:#F6D6EC; --c5-line:#D98ABF; --c5-ink:#7A1C5E;
  --c6-bg:#F9D5CA; --c6-line:#E58A70; --c6-ink:#7A2A12;
  --c7-bg:#CDEDE9; --c7-line:#6FC0B6; --c7-ink:#0F5A52;
  --c8-bg:#E6EDBD; --c8-line:#B5C752; --c8-ink:#4C5A0A;
  --c9-bg:#DADCF7; --c9-line:#9A9FE0; --c9-ink:#2F3490;
  --c10-bg:#EBDCCB; --c10-line:#C09A72; --c10-ink:#5C3A17;
  --c11-bg:#DFE3E8; --c11-line:#9AA5B1; --c11-ink:#2F3B48;
  --c12-bg:#F8D3DC; --c12-line:#E08AA0; --c12-ink:#7A1B38;
  --shadow-1:0 1px 2px rgba(34,32,27,.07),0 2px 6px -2px rgba(34,32,27,.06);
  --shadow-2:0 2px 4px rgba(34,32,27,.06),0 10px 24px -8px rgba(34,32,27,.16);
  --shadow-3:0 4px 8px rgba(34,32,27,.08),0 24px 48px -12px rgba(34,32,27,.30);
  --shadow-accent:0 1px 2px rgba(39,70,144,.35),0 5px 12px -5px rgba(39,70,144,.50);
  --shadow-inset:inset 0 1px 2px rgba(34,32,27,.08);
  --shadow-bar:0 8px 14px -12px rgba(34,32,27,.40);
  --ease:cubic-bezier(.2,.7,.2,1); --dur:.16s;
  --r-sm:8px; --r-md:12px; --r-lg:16px; --r-xl:24px;
  --f-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-head:"Noto Serif TC","Noto Sans TC","PMingLiU",serif;
  --f-no:"Noto Sans TC","Microsoft JhengHei",sans-serif;
}

  --danger:#F0617F; --danger-soft:#3A1A22; --danger-ink:#F7B2C0; --danger-line:#6B2B3B;

  --c4-bg:#2D2342; --c4-line:#5B4A8A; --c4-ink:#D8C9F2;
  --c5-bg:#43203A; --c5-line:#8A3F78; --c5-ink:#F5C3E6;
  --c6-bg:#432519; --c6-line:#8A4A33; --c6-ink:#F7CFC0;
  --c7-bg:#17332F; --c7-line:#2F7068; --c7-ink:#BDEBE4;
  --c8-bg:#2E3312; --c8-line:#6D7A22; --c8-ink:#E0EBA8;
  --c9-bg:#232545; --c9-line:#4F559B; --c9-ink:#CDD0F5;
  --c10-bg:#3A2D1F; --c10-line:#7C5E3C; --c10-ink:#EBD6BC;
  --c11-bg:#26292E; --c11-line:#566170; --c11-ink:#D3D9E0;
  --c12-bg:#43202B; --c12-line:#8C3F57; --c12-ink:#F5C3D0;
  --shadow-1:0 1px 2px rgba(0,0,0,.55),0 2px 8px -2px rgba(0,0,0,.40),inset 0 1px 0 rgba(255,255,255,.03); --shadow-2:0 2px 4px rgba(0,0,0,.5),0 10px 24px -8px rgba(0,0,0,.6); --shadow-3:0 4px 8px rgba(0,0,0,.5),0 24px 48px -12px rgba(0,0,0,.75);
  --shadow-accent:0 1px 2px rgba(0,0,0,.5),0 5px 12px -5px rgba(63,99,196,.55); --shadow-inset:inset 0 1px 2px rgba(0,0,0,.35); --shadow-bar:0 8px 14px -12px rgba(0,0,0,.8);
  color-scheme:dark}}

  --c4-bg:#2D2342; --c4-line:#5B4A8A; --c4-ink:#D8C9F2;
  --c5-bg:#43203A; --c5-line:#8A3F78; --c5-ink:#F5C3E6;
  --c6-bg:#432519; --c6-line:#8A4A33; --c6-ink:#F7CFC0;
  --c7-bg:#17332F; --c7-line:#2F7068; --c7-ink:#BDEBE4;
  --c8-bg:#2E3312; --c8-line:#6D7A22; --c8-ink:#E0EBA8;
  --c9-bg:#232545; --c9-line:#4F559B; --c9-ink:#CDD0F5;
  --c10-bg:#3A2D1F; --c10-line:#7C5E3C; --c10-ink:#EBD6BC;

  --shadow-1:0 1px 2px rgba(0,0,0,.55),0 2px 8px -2px rgba(0,0,0,.40),inset 0 1px 0 rgba(255,255,255,.03); --shadow-2:0 2px 4px rgba(0,0,0,.5),0 10px 24px -8px rgba(0,0,0,.6); --shadow-3:0 4px 8px rgba(0,0,0,.5),0 24px 48px -12px rgba(0,0,0,.75);
  --shadow-accent:0 1px 2px rgba(0,0,0,.5),0 5px 12px -5px rgba(63,99,196,.55); --shadow-inset:inset 0 1px 2px rgba(0,0,0,.35); --shadow-bar:0 8px 14px -12px rgba(0,0,0,.8);
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--f-ui);font-size:14px;line-height:1.65;
  padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
.wrap{max-width:1160px;margin:20px auto 64px;padding:24px;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-xl);box-shadow:var(--shadow-2)}
@media (max-width:560px){.wrap{padding:14px;margin-top:12px;border-radius:var(--r-lg)}}
h1,h2,h3{font-family:var(--f-head);font-weight:700;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:26px} h2{font-size:26px} h3{font-size:18px}
p{margin:0}
.muted{color:var(--text-3)} .small{font-size:13px}
.num{font-variant-numeric:tabular-nums}
code{font-family:ui-monospace,Consolas,monospace;font-size:12px;background:var(--sunken);border:1px solid var(--line);border-radius:6px;padding:1px 5px}

/* 頁首 */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-left,0px));display:flex;gap:12px;align-items:center;flex-wrap:wrap}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.top .brand{font-family:var(--f-head);font-weight:700;font-size:14px;margin-right:auto}
.toc{display:flex;gap:4px;flex-wrap:wrap}
.toc a{color:var(--text-2);text-decoration:none;padding:6px 10px;border-radius:var(--r-sm);font-weight:500}
.toc a:hover{background:var(--sunken);color:var(--text)}
.hero{padding-block:28px 8px;display:grid;gap:10px}
.hero p{max-width:68ch;color:var(--text-2)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:8px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px}
.fact b{display:block;font-size:13px;color:var(--text-3);font-weight:700;margin-bottom:2px}
section{padding-top:48px;scroll-margin-top:64px}
section>header{display:grid;gap:6px;margin-bottom:18px}
section>header p{color:var(--text-2);max-width:72ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;box-shadow:var(--shadow-1);min-width:0}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.stack{display:grid;gap:16px;min-width:0}
.grid2{display:grid;gap:16px;grid-template-columns:260px minmax(0,1fr)}
@media (max-width:700px){.grid2{grid-template-columns:minmax(0,1fr)}.prev{overflow-x:auto;justify-items:start}}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.lab{font-size:13px;font-weight:700;color:var(--text-3);margin-bottom:8px;letter-spacing:.04em}
.pending{display:inline-block;font-size:13px;font-weight:700;padding:1px 8px;border-radius:99px;background:var(--warn-soft);color:var(--warn-ink);border:1px solid var(--warn-line);vertical-align:middle;margin-left:6px}
.scroll{overflow-x:auto;max-width:100%}

/* 色票 */
.sw-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.swatch{border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;background:var(--surface)}
.swatch i{display:block;height:44px;border-bottom:1px solid var(--line)}
.swatch div{padding:6px 10px;font-size:13px;line-height:1.4}
.swatch b{display:block;font-size:13px}
.swatch span{color:var(--text-3);font-family:ui-monospace,Consolas,monospace}

/* 字型 */
.fonts{display:grid;gap:12px}
.fontrow{display:grid;grid-template-columns:170px 1fr;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.fontrow:last-child{border-bottom:0}
.fontrow .nm{font-size:13px;color:var(--text-3);font-weight:700}
@media (max-width:640px){.fontrow{grid-template-columns:1fr}}
.no-sample{display:flex;gap:18px;flex-wrap:wrap}
.no-sample div{background:var(--sunken);border:1px solid var(--line);border-radius:var(--r-md);padding:10px 16px;text-align:center;min-width:128px}
.no-sample strong{display:block;font-size:34px;line-height:1.1;font-variant-numeric:tabular-nums}
.no-sample small{display:block;font-size:13px;color:var(--text-3);margin-top:4px}
table.t{border-collapse:collapse;width:100%;min-width:560px}
.t th{text-align:left;font-size:13px;color:var(--text-3);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line-2);background:var(--sunken);white-space:nowrap}
.t td{padding:8px 10px;border-bottom:1px solid var(--line)}
.t tbody tr:hover{background:var(--accent-soft)}
.t td.n{font-variant-numeric:tabular-nums}
.t tr.gap td{color:var(--text-3);font-style:normal;background:repeating-linear-gradient(135deg,transparent 0 6px,var(--sunken) 6px 12px)}
.dem{display:grid;gap:8px}
.dem div{display:grid;grid-template-columns:90px 1fr;gap:12px;align-items:baseline}
.space-demo{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap}
.space-demo i{display:block;background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:3px}
.rad{display:flex;gap:14px;flex-wrap:wrap}
.rad div{width:92px;height:62px;background:var(--surface);border:1px solid var(--line-2);display:grid;place-items:center;font-size:13px;color:var(--text-2)}

/* 按鈕 */
.btn{font:inherit;font-weight:700;min-height:40px;padding:0 16px;border-radius:var(--r-sm);border:1px solid var(--line-2);background:var(--surface);color:var(--text);cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:background .15s,border-color .15s}
.btn:hover{background:var(--sunken);border-color:var(--text-3)}
.btn:focus-visible,.input:focus-visible,.seg button:focus-visible,.cell:focus-visible,.step:focus-visible,.icon-btn:focus-visible,.sw input:focus-visible+.trk,.fmt input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px}
.btn-primary{background:var(--accent);color:var(--accent-on);border-color:var(--accent)}
.btn-primary:hover{background:var(--accent);filter:brightness(1.12);border-color:var(--accent)}
.btn-danger{background:var(--danger-soft);color:var(--danger-ink);border-color:var(--danger-line)}
.btn-danger:hover{background:var(--danger-soft);border-color:var(--danger)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--accent-ink)}
.btn-ghost:hover{background:var(--accent-soft);border-color:transparent}
.btn-sm{min-height:32px;padding:0 10px;font-size:13px}
.btn-lg{min-height:40px;padding:0 20px;font-size:14px}
.btn{justify-content:center;white-space:nowrap}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btnrow .btn{min-width:96px}
.btn[disabled]{opacity:1;background:var(--sunken);color:var(--text-3);border-color:var(--line);cursor:not-allowed}
.icon-btn{width:40px;height:40px;border-radius:var(--r-sm);border:1px solid var(--line-2);background:var(--surface);color:var(--text);font:inherit;font-weight:700;font-size:18px;cursor:pointer}
.icon-btn:hover{background:var(--sunken)}

/* 表單 */
.field{display:grid;gap:6px;min-width:0}
.field label,.label{font-size:13px;font-weight:700;color:var(--text-2)}
.input{font:inherit;height:40px;min-height:40px;padding:0 12px;border-radius:var(--r-sm);border:1px solid var(--line-2);background:var(--sunken);color:var(--text);width:100%}
.input:focus{border-color:var(--accent)}
.hint{font-size:13px;color:var(--text-3)}
.err .input{border-color:var(--danger)} .err .hint{color:var(--danger-ink)}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:var(--r-sm);overflow:hidden;background:var(--sunken)}
.seg button{font:inherit;font-weight:700;min-height:36px;padding:0 14px;border:0;background:transparent;color:var(--text-2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-on)}
.seg button:disabled{color:var(--text-3);cursor:not-allowed;background:repeating-linear-gradient(135deg,transparent 0 5px,var(--line) 5px 10px)}
.sw{display:inline-flex;align-items:center;gap:10px;cursor:pointer}
.sw input{position:absolute;opacity:0;width:1px;height:1px}
.trk{width:46px;height:26px;border-radius:99px;background:var(--line-2);position:relative;transition:background .15s;flex:none}
.trk::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow-1);transition:transform .15s}
.sw input:checked+.trk{background:var(--accent)}
.sw input:checked+.trk::after{transform:translateX(20px)}
.sw .st{font-size:13px;font-weight:700;color:var(--text-3);white-space:nowrap}
.sw input:checked~.st{color:var(--accent-ink)}
.sw .no{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;border:1.5px solid var(--line-2);background:var(--surface);color:var(--text-2);flex:none}
.fmts{display:flex;gap:10px;flex-wrap:wrap}
.fmt{cursor:pointer}
.fmt input{position:absolute;opacity:0;width:1px;height:1px}
.fmt span{display:inline-flex;align-items:center;gap:10px;min-height:48px;padding:0 18px 0 12px;border-radius:var(--r-md);border:1.5px solid var(--line-2);background:var(--surface);font-weight:700;color:var(--text)}
.fmt:hover span{background:var(--sunken)}
.fmt svg{width:26px;height:26px;flex:none}
.fmt.w input:checked+span{background:var(--fmt-word-soft);border-color:var(--fmt-word)}
.fmt.p input:checked+span{background:var(--fmt-pdf-soft);border-color:var(--fmt-pdf)}
.fmt.x input:checked+span{background:var(--fmt-xls-soft);border-color:var(--fmt-xls)}
.ic-bg-w{fill:var(--fmt-word)} .ic-bg-p{fill:var(--fmt-pdf)} .ic-bg-x{fill:var(--fmt-xls)}
.check{display:inline-flex;gap:8px;align-items:center;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.stepper{display:inline-flex;align-items:center;gap:6px}
.stepper output{min-width:44px;text-align:center;font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}

/* 徽章、提示 */
.badge{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:700;padding:2px 9px;border-radius:99px;border:1px solid var(--line-2);background:var(--sunken);color:var(--text-2)}
.b-acc{background:var(--accent-soft);color:var(--accent-ink);border-color:var(--accent-line)}
.b-ok{background:var(--ok-soft);color:var(--ok-ink);border-color:var(--ok-line)}
.b-warn{background:var(--warn-soft);color:var(--warn-ink);border-color:var(--warn-line)}
.b-err{background:var(--danger-soft);color:var(--danger-ink);border-color:var(--danger-line)}
.b-soon{background:repeating-linear-gradient(135deg,transparent 0 5px,var(--line) 5px 10px);color:var(--text-2)}
.alert{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;padding:12px 14px;border-radius:var(--r-md);border:1px solid;font-weight:500}
.alert b{font-weight:700}
.a-info{background:var(--accent-soft);color:var(--accent-ink);border-color:var(--accent-line)}
.a-warn{background:var(--warn-soft);color:var(--warn-ink);border-color:var(--warn-line)}
.a-err{background:var(--danger-soft);color:var(--danger-ink);border-color:var(--danger-line)}
.a-ok{background:var(--ok-soft);color:var(--ok-ink);border-color:var(--ok-line)}

.cp[data-c="11"]{background:var(--c11-bg);border-color:var(--c11-line);color:var(--c11-ink)} .cp[data-c="12"]{background:var(--c12-bg);border-color:var(--c12-line);color:var(--c12-ink)}
.chip-class[data-c="7"]{background:var(--c7-bg);border-color:var(--c7-line);color:var(--c7-ink)} .chip-class[data-c="8"]{background:var(--c8-bg);border-color:var(--c8-line);color:var(--c8-ink)}
.chip-class[data-c="9"]{background:var(--c9-bg);border-color:var(--c9-line);color:var(--c9-ink)} .chip-class[data-c="10"]{background:var(--c10-bg);border-color:var(--c10-line);color:var(--c10-ink)}
.chip-class[data-c="11"]{background:var(--c11-bg);border-color:var(--c11-line);color:var(--c11-ink)} .chip-class[data-c="12"]{background:var(--c12-bg);border-color:var(--c12-line);color:var(--c12-ink)}
/* UI-01/02：資料夾視窗的標題列原本借用了進度條的 .bar（高 6px、overflow:hidden），文字被切掉 */
.fakepick .fp-bar{padding:10px 14px;background:var(--surface);border-bottom:1px solid var(--line);font-size:13px;line-height:1.5;color:var(--text-2)}
.fakepick button{min-height:44px}
.modal{max-height:calc(100vh - 32px);overflow:auto}
.modal .t{min-width:0}
/* UI-03：拖拉資料夾 */
.dropzone{display:grid;gap:8px;justify-items:center;align-content:center;text-align:center;min-height:clamp(200px,34vh,380px);padding:28px 20px;border:2px dashed var(--accent-line);border-radius:var(--r-lg);background:var(--accent-soft);color:var(--accent-ink);cursor:pointer}
.dropzone strong{font-size:18px}
.dropzone:hover,.dropzone.over{border-color:var(--accent);background:var(--surface)}
.dropzone:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
/* UI-04：表單欄位對齊（每格都有提示行，高度一致）*/
.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px;align-items:start}
.formgrid .field{align-content:start}
@media (max-width:480px){.formgrid{grid-template-columns:minmax(0,1fr)}}
/* UI-11：按鈕與分段按鈕同高（40px）*/
.seg button{min-height:38px}
.cp .seg button{min-height:32px}
.seg.fmtseg{align-self:start}
/* UI-19：考科名稱不拆字，只在「、」後換行 */
.nb{white-space:nowrap}
/* UI-16～18：教室列與展開的座位表編輯 */
.rw{display:grid;gap:8px}
.roomrow{cursor:pointer}
.roomrow input,.roomrow .stepper{cursor:auto}
/* 設定頁教室清單：點整列＝按「編輯座位表」，再點收合；輸入框、按鈕維持原操作（UI-18） */
/* 步驟③ 狀態檢核：一項一格，上名稱、中大數字（座位數）、下狀態徽章；未通過用警示色（同 .stats .bad）；多出來用琥珀 */
.stats.chkgrid{grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:0;background:var(--surface)}
.stats.chkgrid>div.chk{border-right:1px solid var(--line);border-bottom:1px solid var(--line);margin:0 -1px -1px 0}
.stats>div.chk{display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.stats>div.chk .sub{font-size:13px;color:var(--text-3);font-weight:500}
.stats>div.chk .badge{margin-top:6px}
.stats>div.chk.bad{background:var(--danger-soft)}
.stats>div.chk.warnc::before{background:var(--warn-bar)}
.errnote{color:var(--danger-ink)}
.statblk{border-top:1px solid var(--line);padding-top:14px}
.t tr.rowtap{cursor:pointer}
.t tr.rowtap.open{background:var(--accent-soft)}
.t tr.rowtap .input{cursor:text}.t tr.rowtap .btn{cursor:pointer}
.roomedit{display:grid;gap:12px;padding:14px;border:1px solid var(--accent-line);border-radius:var(--r-md);background:var(--surface)}
.roomedit h4{margin:0;font-family:var(--f-head);font-size:14px}
.prev .pgrid .pc{width:100%;height:32px}
.t tr.editrow:hover{background:transparent}
.t tr.editrow>td{padding:10px 0}
/* UI-20：標籤紙（B4／A3），6 欄 × 8 列 = 48 格，格子大小固定 */
.lsheet-wrap{display:grid;gap:8px;justify-items:center}
.lsheet-box{max-width:100%}
.lsheet{container-type:inline-size;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));grid-template-rows:repeat(8,minmax(0,1fr));aspect-ratio:250/353;width:100%;border-top:1px solid var(--cut);border-left:1px solid var(--cut);background:var(--surface);box-shadow:var(--shadow-2)}
.utabs{display:flex;gap:4px;border-bottom:2px solid var(--line-2);overflow-x:auto;max-width:100%}
.utabs button{font:inherit;font-weight:700;min-height:44px;padding:0 18px;border:0;border-bottom:4px solid transparent;margin-bottom:-2px;background:transparent;color:var(--text-2);cursor:pointer;white-space:nowrap}
.utabs button:hover{color:var(--text)}
.utabs button[aria-pressed="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.utabs button:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
.seg.seg-soft{background:var(--surface);border-radius:999px;padding:3px;gap:2px}
.seg.seg-soft button{border-radius:999px;min-height:32px}
.seg.seg-soft button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.lprev{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.lprev figure{margin:0}
.lprev-box{overflow:hidden}
.lsheet-one{container-type:inline-size}
.lprev-cell{display:grid;border-top:1px solid var(--cut);border-left:1px solid var(--cut)}
.lprev-cell .lcell{height:100%}
.lprev figcaption{font-size:12px;color:var(--text-2);margin-top:6px;line-height:1.4}
.lcell{position:relative;display:grid;grid-template-rows:1fr auto auto;justify-items:center;align-items:center;border-right:1px solid var(--cut);border-bottom:1px solid var(--cut);padding:1.2cqw .4cqw 1.4cqw;row-gap:.9cqw;text-align:center;font-family:var(--f-no);overflow:hidden;min-width:0;color:#22201B;line-height:1.15}
.lcell .no{font-size:4.8cqw;font-weight:700;letter-spacing:.02em;font-variant-numeric:tabular-nums;padding-top:1cqw;line-height:1.1;align-self:end}
.lcell .nm{font-size:2.5cqw;font-weight:700;white-space:nowrap;line-height:1.2}
.lcell .tag-c{color:var(--cx);margin-right:1cqw;padding-right:1cqw;border-right:.3cqw solid var(--cx)}
.lcell .co{position:absolute;right:.9cqw;top:.6cqw;font-size:2.2cqw;font-weight:700;font-variant-numeric:tabular-nums}
.lcell .mks{display:flex;flex-wrap:wrap;justify-content:center;gap:.4cqw .5cqw;max-width:100%}
.lcell .mks:has(.mk:nth-child(2)) .mk{font-size:1.5cqw;line-height:2cqw;padding:0 .5cqw;border-width:.3cqw}
.lcell .mks:has(.mk:nth-child(3)) .mk{font-size:1.35cqw;line-height:1.7cqw;padding:0 .4cqw}
.lcell .mk{font-size:1.9cqw;font-weight:700;padding:0 .7cqw;line-height:2.4cqw;border-radius:3px;white-space:nowrap}
.lcell.mk-x .mk{background:#22201B;color:#fff;border:.4cqw solid #22201B}
.lcell.mk-add .mk{background:#fff;color:#22201B;border:.4cqw solid #22201B}
/* 標籤白底；特殊情形（不考、加考、抽離）一律淡黃底＋深色內框＋底部小標；班級靠「班級｜姓名」小字分辨，不用班級色（使用者定案，DESIGN 第六章；座位表仍用班級色）*/
.lcell.sp{box-shadow:inset 0 0 0 .5cqw #22201B}
.lcell.blank{background:repeating-linear-gradient(135deg,var(--sunken) 0 5px,var(--line-2) 5px 10px)}
/* UI-23：抽離座位表改柔和單色（深淺色都用主色淡底），班級字與座標照印，黑白列印仍分得出 */
.chart.pull{--cw:104px;--ch:112px}
.chart.pull .cell:not(.empty-seat){background:var(--accent-soft);border:2px solid var(--accent-line);color:var(--accent-ink)}
.chart.pull .cell:not(.empty-seat) .no,.chart.pull .cell:not(.empty-seat) .co,.chart.pull .cell:not(.empty-seat) .meta,.chart.pull .cell[data-c] .meta,.chart.pull .cell .meta .tg{color:var(--accent-ink)}
.chart.pull .cell:not(.empty-seat) .no{font-size:25px}
.chart.pull .cell:not(.empty-seat) .meta{font-size:13px;font-weight:700}
.chart.pull .cell .mk{font-size:12px}
/* ===== 第二輪拉皮（D90，2026-11-09）：只改外觀——層次、主次、回饋。不動結構、欄數、內容、字級（仍四級）===== */
/* 層次：頁面底 < 卡片（shadow-1）< 懸停／展開（shadow-2）< 對話框、提示（shadow-3）。主要動作才用 shadow-accent */
.btn,.icon-btn{box-shadow:var(--shadow-1);transition:background var(--dur) var(--ease),border-color var(--dur) var(--ease),box-shadow var(--dur) var(--ease),transform var(--dur) var(--ease)}
.btn:hover,.icon-btn:hover{box-shadow:var(--shadow-2)}
.btn:active,.icon-btn:active{transform:translateY(1px);box-shadow:none}
.btn-primary{box-shadow:var(--shadow-accent)}
.btn-primary:hover{box-shadow:var(--shadow-accent),0 8px 16px -8px rgba(39,70,144,.45)}
.btn-primary:active{filter:brightness(.94);box-shadow:none}
.btn-ghost,.btn-ghost:hover,.btn[disabled],.btn[disabled]:hover{box-shadow:none}
.btn[disabled]:active{transform:none}
.btn-danger:hover{box-shadow:var(--shadow-1)}

/* 輸入：凹陷底＋聚焦轉成表面色 */
.input{box-shadow:var(--shadow-inset);transition:background var(--dur) var(--ease),border-color var(--dur) var(--ease)}
.input:focus{background:var(--surface);border-color:var(--accent)}

/* 分段鈕、開關、格式鈕 */
.seg{box-shadow:var(--shadow-inset)}
.seg button{transition:background var(--dur) var(--ease),color var(--dur) var(--ease)}
.seg button:hover:not([aria-pressed="true"]):not(:disabled){background:var(--line);color:var(--text)}
.seg button[aria-pressed="true"]{box-shadow:inset 0 -2px 0 rgba(0,0,0,.22)}
.seg.seg-soft button[aria-pressed="true"]{box-shadow:inset 0 0 0 1.5px var(--accent)}
.trk{box-shadow:inset 0 1px 2px rgba(0,0,0,.18)}
.trk::after{box-shadow:0 1px 3px rgba(0,0,0,.35);transition:transform var(--dur) var(--ease)}
.sw:hover input:not(:checked)+.trk{background:var(--text-3)}
.sw:hover input:checked+.trk{filter:brightness(1.12)}
.fmt span{box-shadow:var(--shadow-1);transition:background var(--dur) var(--ease),border-color var(--dur) var(--ease),box-shadow var(--dur) var(--ease)}
.fmt:hover span{box-shadow:var(--shadow-2)}
.fmt.w input:checked+span{box-shadow:0 0 0 1px var(--fmt-word),var(--shadow-1)}
.fmt.p input:checked+span{box-shadow:0 0 0 1px var(--fmt-pdf),var(--shadow-1)}
.fmt.x input:checked+span{box-shadow:0 0 0 1px var(--fmt-xls),var(--shadow-1)}

/* 步驟導覽：目前位置加左側色條與立體環，已完成／過期用細環 */
.step{transition:background var(--dur) var(--ease),box-shadow var(--dur) var(--ease)}
.step.cur{box-shadow:inset 3px 0 0 var(--accent),var(--shadow-1)}
.step.cur .no{box-shadow:0 0 0 3px var(--accent-line)}
.step.done .no{box-shadow:inset 0 0 0 1px var(--ok-bar)}
.step.stale .no{box-shadow:inset 0 0 0 1px var(--warn-bar)}
.step:not(.cur):hover .no{border-color:var(--accent);color:var(--accent-ink)}

/* 統計列：每格頂端一小段色條，異常格用警示色；整體浮起一層 */
.stats{box-shadow:var(--shadow-1)}
.stats>div{position:relative;padding-top:13px}
.stats>div::before{content:"";position:absolute;left:14px;top:0;width:22px;height:3px;border-radius:0 0 3px 3px;background:var(--accent-line)}
.stats .bad::before{background:var(--danger)}

/* 提示條：左側 4px 色條表達語氣，不再只靠底色 */
.alert{box-shadow:inset 4px 0 0 var(--bar,var(--line-2));padding-left:18px}
.a-info{--bar:var(--accent)} .a-warn{--bar:var(--warn-bar)} .a-err{--bar:var(--danger)} .a-ok{--bar:var(--ok-bar)}

/* 表格：表頭加粗底線、列懸停有過渡 */
.t th{border-bottom:2px solid var(--line-2)}
.t tbody tr{transition:background var(--dur) var(--ease)}

/* 可點的卡片：懸停浮起、選中有外環 */
.exam,.tcard,.roomrow{transition:box-shadow var(--dur) var(--ease),border-color var(--dur) var(--ease),transform var(--dur) var(--ease),background var(--dur) var(--ease)}
.exam:hover{box-shadow:var(--shadow-2);border-color:var(--line-2)}
.tcard:hover:not(:disabled){box-shadow:var(--shadow-2);transform:translateY(-1px)}
.tcard[aria-pressed="true"]{box-shadow:0 0 0 1px var(--accent),var(--shadow-2)}
.roomrow:hover{border-color:var(--line-2);box-shadow:var(--shadow-1)}
.roomrow.on{box-shadow:inset 3px 0 0 var(--accent)}
.fakepick button{transition:background var(--dur) var(--ease)}
.dropzone{transition:background var(--dur) var(--ease),border-color var(--dur) var(--ease),box-shadow var(--dur) var(--ease)}
.dropzone:hover,.dropzone.over{box-shadow:var(--shadow-2)}

/* 頁首列與對話框 */
.pbar{box-shadow:var(--shadow-bar)}
.pbar .nav button{transition:background var(--dur) var(--ease)}
.pbar .nav button[aria-current="true"]{box-shadow:inset 0 -2px 0 var(--accent)}
.mfade{backdrop-filter:blur(2px)}
.utabs button{transition:color var(--dur) var(--ease),border-color var(--dur) var(--ease)}
/* 層次補強：外框底改用凹陷色，卡片（surface）才浮得起來；表格隔列淡底方便橫向對讀 */
.wrap{background:var(--sunken);border-color:var(--line)}
.t tbody tr:nth-child(even):not(.editrow):not(.gap){background:rgba(111,104,88,.06)}
.t tbody tr:nth-child(even):not(.editrow):not(.gap):hover{background:var(--accent-soft)}
/* ===== 步驟⑥ 預覽：真實匯出的紙面樣式（同 設計系統.html 座位表與標籤、src/export/htmlRender.ts；紙面永遠淺色，單位 mm）===== */
.pp-stage{display:flex;justify-content:center;padding:14px;background:var(--sunken);border-radius:var(--r-md);overflow:auto}
.pp-fit{position:relative;flex:none}
/* 紙面：永遠淺色，單位 mm（1mm＝3.7795px） */
.pp{--ink:#22201B;--navy:#1F3A5F;--gray:#6B6657;--cut:#8E8670;--red:#C0262D;
  --c1:#FBE7C6;--c1i:#6B4300;--c2:#D8EFD3;--c2i:#1F5A1A;--c3:#D6E6F8;--c3i:#1A4478;
  position:absolute;left:0;top:0;transform-origin:0 0;background:#fff;color:var(--ink);box-shadow:0 2px 12px rgba(0,0,0,.18);
  font-family:'Noto Sans TC','Microsoft JhengHei',sans-serif;overflow:hidden}
.pp,.pp *{box-sizing:border-box}
.pp-gray{filter:grayscale(1)}
.pp .pp-hd{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:.8mm solid var(--navy);padding-bottom:3mm}
.pp .pp-h1{color:var(--navy);font-weight:700;font-size:15pt;letter-spacing:.04em}
.pp .pp-h2{font-family:'Noto Serif TC','PMingLiU',serif;font-weight:700;font-size:28pt;line-height:1.1;margin-top:1mm}
.pp .pp-room{display:block;background:var(--navy);color:#fff;border-radius:1.2mm;padding:1.6mm 6mm;font-weight:700;font-size:16pt}
.pp .pp-chips{display:flex;gap:2mm;flex-wrap:wrap;margin:3.5mm 0 0}
.pp .pp-chip{border:.3mm solid var(--navy);color:var(--navy);border-radius:5mm;padding:.6mm 3.5mm;font-size:12pt;font-weight:700}
.pp .pp-chip.s{background:var(--navy);color:#fff}
.pp .pp-grid{display:grid;border-top:.35mm solid var(--cut);border-left:.35mm solid var(--cut);width:max-content}
.pp.pp-seat .pp-grid{border:.7mm solid var(--ink)}
.pp .pp-c{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.4mm;border-right:.35mm solid var(--cut);border-bottom:.35mm solid var(--cut);text-align:center}
.pp.pp-seat .pp-c{border-right-width:.3mm;border-bottom-width:.3mm}
.pp .pp-co{position:absolute;right:1.1mm;top:.8mm;font-style:normal;font-weight:700;color:#4A463A;font-size:6.5pt;line-height:1;font-variant-numeric:tabular-nums}
.pp .pp-no{font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.02em;line-height:1}
.pp .pp-nm{font-weight:500;line-height:1.15;white-space:nowrap}
.pp .pp-nm em{font-style:normal;font-weight:700;margin-right:1.2mm;padding-right:1.2mm;border-right:.3mm solid currentColor}
.pp .pp-mk{display:block;font-weight:700;line-height:1.25;padding:0 1.4mm;border-radius:.6mm;white-space:nowrap}
.pp .pp-mk.x{background:var(--ink);color:#fff;border:.3mm solid var(--ink)}
.pp .pp-mk.add{background:#fff;color:var(--ink);border:.45mm double var(--ink)}
.pp .pp-c.mk{box-shadow:inset 0 0 0 .7mm var(--ink)}
.pp .pp-e{background:repeating-linear-gradient(135deg,#F1EDE0 0 1.2mm,#E2DCC8 1.2mm 2.4mm)}
/* 格內分三區（編號區／姓名／標示區固定高），有沒有標示位置都一樣，三區之間有留白，不擠在中間 */
.pp.pp-lab .pp-c{display:grid;grid-template-rows:1fr auto 9mm;justify-items:center;align-items:center;gap:0;padding:5mm 1mm .8mm}
.pp.pp-lab .pp-no{align-self:end;margin-bottom:2.6mm;font-size:31pt}.pp.pp-lab .pp-nm{font-size:15pt}.pp.pp-lab .pp-mk{font-size:12pt}.pp.pp-lab .pp-co{font-size:9pt}
.pp.pp-lab.b4 .pp-no{font-size:33pt}
.pp.pp-seat .pp-c{display:grid;grid-template-rows:1fr auto 5.2mm;justify-items:center;align-items:center;gap:0;padding:4.5mm .5mm .8mm}
.pp.pp-seat .pp-no{font-size:19pt}.pp.pp-seat .pp-nm{font-size:8.5pt}.pp.pp-seat .pp-mk{font-size:7.5pt}
.pp .pp-note{margin-top:8mm;font-size:20pt;line-height:1.75;border:.3mm solid var(--cut);border-left:2.4mm solid var(--navy);border-radius:1.5mm;padding:5mm 9mm;background:#FBF8EE;width:max-content;max-width:100%}
.pp .pp-note h4{margin:0 0 2mm;color:var(--navy);font-size:22pt}
.pp .pp-note b{font-weight:700}
.pp.b4 .pp-note{margin-top:5mm;font-size:13pt;padding:3mm 6mm;border-left-width:1.8mm}.pp.b4 .pp-note h4{font-size:14pt;margin-bottom:1mm}
.pp .pp-foot{position:absolute;left:0;right:0;bottom:6mm;text-align:center;font-size:9.5pt;color:var(--gray)}
.pp .pp-bottom{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin-top:3mm}
.pp .pp-bottom .l{font-size:9pt}
.pp .pp-pod{border:.5mm solid var(--ink);padding:1.2mm 12mm;font-weight:700;font-size:13pt;letter-spacing:.6em;padding-left:calc(12mm + .6em)}
.pp .pp-ax{display:grid;font-size:7pt;font-weight:700;color:var(--gray);text-align:center;margin-top:.8mm}
.pp .pp-wrapg{display:grid;grid-template-columns:5mm auto;justify-content:center;gap:0 1.5mm}
.pp .pp-ay{display:grid;font-size:7pt;font-weight:700;color:var(--gray);align-items:center;justify-items:end}
.pp .pp-st{width:100%;border-collapse:collapse;font-size:13pt;margin-top:5mm}
.pp .pp-st th,.pp .pp-st td{border:.3mm solid var(--cut);padding:.8mm 2mm;text-align:center}
.pp .pp-st th{background:#F3EEDD;font-weight:700}
.pp .pp-st td:first-child{text-align:left}
.pp .pp-st td.t{font-weight:700}

/* ===== 稿修正（2026-11-09）：學期選項卡、復原歷史、頁尾 ===== */
.termcards{display:flex;gap:10px;flex-wrap:wrap}
.tcard.term{display:inline-flex;align-items:center;gap:10px;padding:8px 16px;min-height:44px;width:auto}
.tcard.term strong{font-size:14px;font-family:var(--f-ui)}
.tcard.term .tick{position:static}
.undowrap{position:relative;display:inline-flex}

  document.addEventListener('keydown',function(ev){if((ev.ctrlKey||ev.metaKey)&&ev.key==='z'&&!/^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement||{}).tagName||'')&&S.screen!=='init'){ev.preventDefault();undo()}});
  window.addEventListener('resize',function(){fitCharts();fitPapers()});
  var lastKey='';
  function render(){
    CACHE={};
    var v=S.screen==='init'?vInit():S.screen==='list'?vList():S.screen==='new'?vNew():S.screen==='settings'?vSettings():['special','cmp','ovr','prep','find'].indexOf(S.screen)>-1?vSpecial():vWs();
    $('#app').innerHTML=v;nav();fitCharts();fitPapers();
    var key=S.screen+'|'+S.step+'|'+(S.cur?S.cur.id:'');if(key!==lastKey)window.scrollTo(0,0);lastKey=key}
  function go(s){S.screen=s;render()}

  /* ---------- 模擬資料夾選擇 ---------- */
  function openPick(){
    $('#modalHost').innerHTML='<div class="mfade" id="mf"><div class="modal" role="dialog" aria-label="選擇資料夾（模擬）" style="width:min(100%,520px)"><h3>選擇資料夾（模擬）</h3><p class="small muted">真正使用時，這個視窗是瀏覽器自己的，這裡只示範流程。</p>'+
      '<div class="fakepick"><div class="fp-bar">目前位置：本機 › D:</div><button type="button" data-pk="D:\\模擬考資料" aria-pressed="true">📁 模擬考資料</button><button type="button" data-pk="D:\\文件">📁 文件</button><button type="button" data-pk="D:\\下載">📁 下載</button></div>'+
      '<div class="alert a-info"><span class="ico" data-i="i"></span><span>瀏覽器會問：「讓這個網站檢視並編輯這個資料夾的檔案？」請選「允許」。</span><span></span></div>'+
      '<div class="acts"><button class="btn" data-mclose>取消</button><button class="btn btn-primary" id="pkok">選取並允許</button></div></div></div>';
    var sel='D:\\模擬考資料';
    $('#modalHost').onclick=function(e){var p=e.target.closest('[data-pk]');
      if(p){sel=p.getAttribute('data-pk');document.querySelectorAll('[data-pk]').forEach(function(x){x.setAttribute('aria-pressed',String(x===p))})}
      if(e.target.closest('[data-mclose]')||e.target.id==='mf')$('#modalHost').innerHTML='';
      if(e.target.id==='pkok'){S.folder=sel;$('#modalHost').innerHTML='';toast('已授權資料夾：'+sel+'（模擬）');go('list')}}}

  /* ---------- 事件 ---------- */
  $('#app').addEventListener('click',function(e){var b=e.target.closest('[data-act]');if(!b)return;var a=b.getAttribute('data-act');
    if(a==='pick')openPick();
    else if(a==='list')go('list');
    else if(a==='new'){S.type='學測';S.name='';S.term='上學期';go('new')}
    else if(a==='term'){if(b.getAttribute('data-w')==='new')S.term=b.getAttribute('data-t');else{pushUndo('學期');S.cur.term=b.getAttribute('data-t')}render()}
    else if(a==='type'){S.type=b.getAttribute('data-t');S.name='';render()}
    else if(a==='open'){S.cur=S.exams.filter(function(x){return x.id==b.getAttribute('data-id')})[0];S.step=1;go('ws')}
    else if(a==='step'){S.step=+b.getAttribute('data-n');S.ret=null;render()}
    else if(a==='round'){pushUndo('次別');var ce=S.cur;ce.round=+b.getAttribute('data-r');if(/^學測第.次$/.test(ce.name))ce.name='學測第'+CN[ce.round]+'次';ce.subj=null;render()}
    else if(a==='carry'){S.cur.carry=S.cur.carry===false?true:false;render()}
    else if(a==='next1'){S.cur.prog[0]='d';S.step=2;toast('已儲存「'+S.cur.name+'」的考試設定（模擬）');render()}
    else if(a==='create'){var nm=($('#nn')||{}).value||S.name;var isJ=S.type==='會考';var rn=S.exams.filter(function(x){return x.type===S.type}).length+1;var ex={id:Date.now(),round:rn,round0:rn,cmpPending:true,name:nm,type:S.type,level:isJ?'國三':'高三',year:String(schoolYear()),term:S.term,n:isJ?236:266,prog:['c','','','','',''],note:'剛建立',edit:'2026-11-07 15:30'};if(isJ)ex.prog[3]='n';S.exams.unshift(ex);S.cur=ex;S.step=1;S.name='';toast('已建立「'+nm+'」，並帶入上一次的設定');go('ws')}});
  document.addEventListener('click',function(e){if(S.undoOpen&&!e.target.closest('.undowrap')){S.undoOpen=false;render()}});
  $('#app').addEventListener('input',function(e){if(e.target.id==='nn')S.name=e.target.value;if(e.target.id==='xn')S.cur.name=e.target.value});
  $('#app').addEventListener('change',function(e){if(e.target.id==='ny')S.term=e.target.value;if(e.target.id==='xy'){S.cur.term=e.target.value;render()}if(e.target.getAttribute&&e.target.getAttribute('data-ei')!==null&&S.cmp){var ed=S.cmp.edit[+e.target.getAttribute('data-ei')],f=e.target.getAttribute('data-ef'),v=e.target.value;ed[f]=f==='name'?v:+v;render()}});
  document.querySelector('.appfoot').addEventListener('click',function(e){var t=e.target.closest('[data-ft]');if(!t)return;e.preventDefault();var k=t.getAttribute('data-ft'),h;
    if(k==='copy')h='<h3>版權</h3><p>© 2026 derliang｜保留所有權利｜限非營利使用</p><p class="small muted">原型說明：實作是站內獨立的版權頁（不連到 GitHub），頁頂有「← 返回」；這裡用視窗示意。</p>';
    else if(k==='priv')h='<h3>隱私權</h3><p>學生名單與座位結果只存在你的電腦，本網站不會把它們上傳到網路。</p><p class="small muted">原型說明：實作是站內獨立的隱私權頁，頁頂有「← 返回」；這裡用視窗示意。</p>';
    else h='<h3>關於</h3><p>模擬考小幫手　v0.1.0-beta.1（預發布）</p><p class="small muted">版本號與頁首品牌區是同一來源（package.json），建置時注入；建置日期用台北時間。</p>';
    showModal('<div class="modal" role="dialog" aria-label="'+(k==='copy'?'版權':k==='priv'?'隱私權':'關於')+'" style="width:min(100%,460px)">'+h+'<div class="acts"><button class="btn" data-mclose>← 返回</button></div></div>',function(){})});
  render();
})();
</script>
