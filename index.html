<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>模擬考小幫手</title>
<style>
  :root {
    --bg: #f6f7f9;
    --card: #ffffff;
    --text: #1f2933;
    --muted: #616e7c;
    --accent: #2f6fed;
    --border: #d9dee5;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #151a21;
      --card: #1d242d;
      --text: #e6eaf0;
      --muted: #9aa5b1;
      --accent: #6f9bff;
      --border: #2f3a46;
    }
  }
  :root[data-theme="dark"] {
    --bg: #151a21;
    --card: #1d242d;
    --text: #e6eaf0;
    --muted: #9aa5b1;
    --accent: #6f9bff;
    --border: #2f3a46;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px 16px;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    line-height: 1.7;
  }
  main {
    width: min(560px, 100%);
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px 28px;
  }
  h1 { margin: 0 0 8px; font-size: 1.6rem; }
  .tag {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 999px;
    background: var(--accent);
    color: #fff;
    font-size: .8rem;
    margin-bottom: 12px;
  }
  p { margin: 8px 0; color: var(--muted); }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <span class="tag">規劃中</span>
  <h1>模擬考小幫手</h1>
  <p>考場座位安排與座位標籤，純前端運作，學生資料只存在你自己的電腦。</p>
  <p>目前正在規劃，尚未開放使用。進度與決定記錄請見
    <a href="https://github.com/derliang/mock-exam-helper">GitHub 儲存庫</a>。</p>
</main>
</body>
</html>
